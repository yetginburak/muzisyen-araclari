<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d0d1a">
<title>Triad ve Akor Bulucu</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    background: #0d0d1a;
    color: #d0d0d0;
    font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  input[type=range] { accent-color: #e8b84b; width: 100%; height: 28px; }
  button { cursor: pointer; font-family: inherit; }
  button:focus-visible { outline: 2px solid #e8b84b; outline-offset: 2px; }
  .wrap { min-height: 100vh; padding: 24px 16px 48px; }
  .eyebrow { font-size: 11px; letter-spacing: 4px; color: #555; margin-bottom: 6px; text-transform: uppercase; }
  h1 { font-size: 26px; font-weight: 700; color: #f0f0f0; letter-spacing: -0.5px; }
  .controls { display: flex; flex-direction: column; gap: 20px; margin: 28px 0; }
  .lbl { font-size: 12px; color: #888; display: block; margin-bottom: 8px; letter-spacing: 1px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { padding: 8px 12px; border-radius: 4px; border: 1px solid #333; background: transparent; color: #666; font-size: 12px; }
  .scale { display: flex; justify-content: space-between; font-size: 10px; color: #444; margin-top: 2px; }
  .count { font-size: 12px; color: #444; margin-bottom: 16px; }
  .notice { font-size: 12px; color: #e07b39; background: #e07b3915; border: 1px solid #e07b3944; border-radius: 4px; padding: 10px 12px; margin-bottom: 16px; line-height: 1.5; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
  .card { background: #13131f; border-radius: 8px; padding: 16px; overflow-x: auto; }
  .card-name { font-size: 18px; font-weight: 700; }
  .card-sub { font-size: 11px; color: #444; margin-left: 8px; }
  .voicings { display: flex; flex-direction: column; gap: 14px; }
  .voicing + .voicing { border-top: 1px solid #1e1e30; padding-top: 12px; }
  .tab { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 13px; line-height: 1.7; }
  .tab-row { display: flex; align-items: center; gap: 4px; }
  .tab-str { width: 14px; color: #888; text-align: right; }
  .tab-bar { color: #555; }
  .tab-cell { min-width: 28px; text-align: center; color: #d0d0d0; }
  .tab-cell.root { color: #e8b84b; font-weight: 700; }
  .tab-note { margin-left: 8px; font-size: 11px; color: #666; }
  .tab-note.root { color: #e8b84b; font-weight: 700; }
  .tab-start { font-size: 11px; color: #555; margin-top: 4px; }
  .empty { color: #444; text-align: center; padding: 40px; font-size: 14px; line-height: 1.6; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Triad">
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Triad ve Akor Bulucu</div>
    <h1>Tel grubu &times; Perde &times; Akor</h1>
  </header>

  <div class="controls">
    <div>
      <label class="lbl" for="fret">MERKEZ PERDE — <span id="fretVal">5</span></label>
      <input type="range" id="fret" min="1" max="17" value="5">
      <div class="scale"><span>1</span><span>5</span><span>9</span><span>12</span><span>17</span></div>
    </div>
    <div>
      <span class="lbl">TEL GRUBU</span>
      <div class="row" id="stringSets"></div>
    </div>
    <div>
      <span class="lbl">AKOR TÜRÜ</span>
      <div class="row" id="chordTypes"></div>
    </div>
    <div>
      <span class="lbl">KÖK SES</span>
      <div class="row" id="roots"></div>
    </div>
  </div>

  <div id="notice"></div>
  <div class="count" id="count"></div>
  <div class="grid" id="results"></div>
  <div id="empty"></div>
</div>

<script>
"use strict";

var NOTES = ["E","F","F#","G","Ab","A","Bb","B","C","C#","D","Eb"];
var STRINGS = ["E","B","G","D","A","E"];
var STRING_LABELS = ["e","B","G","D","A","E"];

var CHORD_TYPES = {
  "Major":      [0,4,7],
  "Minor":      [0,3,7],
  "Dom7":       [0,4,7,10],
  "Major7":     [0,4,7,11],
  "Minor7":     [0,3,7,10],
  "Diminished": [0,3,6],
  "Augmented":  [0,4,8]
};

var STRING_SETS = {
  "1-2-3 (e-B-G)":     [0,1,2],
  "2-3-4 (B-G-D)":     [1,2,3],
  "3-4-5 (G-D-A)":     [2,3,4],
  "4-5-6 (D-A-E)":     [3,4,5],
  "1-2-3-4 (e-B-G-D)": [0,1,2,3]
};

var TYPE_COLORS = {
  "Major":      { accent:"#e8b84b", label:"#f0d080" },
  "Minor":      { accent:"#6b9bd1", label:"#9bbfe8" },
  "Dom7":       { accent:"#e07b39", label:"#f0a060" },
  "Major7":     { accent:"#7eb87e", label:"#a0d4a0" },
  "Minor7":     { accent:"#9b7ec8", label:"#c4a8e8" },
  "Diminished": { accent:"#c85a5a", label:"#e88888" },
  "Augmented":  { accent:"#c8a05a", label:"#e8c880" }
};

var TYPE_LABELS = {
  "Major": "Majör", "Minor": "Minör", "Dom7": "Dom7", "Major7": "Majör7",
  "Minor7": "Minör7", "Diminished": "Eksik (dim)", "Augmented": "Artık (aug)"
};
function typeLabel(t){ return TYPE_LABELS[t] || t; }

function noteAt(openNote, fret) {
  return NOTES[(NOTES.indexOf(openNote) + fret) % 12];
}
function getNote(stringIndex, fret) {
  return noteAt(STRINGS[stringIndex], fret);
}

function notesMatch(chord, root, intervals) {
  var rootIdx = NOTES.indexOf(root);
  var targets = intervals.map(function (i) { return NOTES[(rootIdx + i) % 12]; });
  return chord.every(function (n) { return targets.indexOf(n) !== -1; })
      && targets.every(function (t) { return chord.indexOf(t) !== -1; });
}

function findVoicings(stringIndices, centerFret, range) {
  var results = [];
  var minFret = Math.max(0, centerFret - range);
  var maxFret = centerFret + range;
  var typeNames = Object.keys(CHORD_TYPES);

  function recurse(strPos, currentFrets) {
    if (strPos === stringIndices.length) {
      var notes = currentFrets.map(function (f, i) { return getNote(stringIndices[i], f); });
      var uniqueNotes = notes.filter(function (n, i) { return notes.indexOf(n) === i; });
      if (uniqueNotes.length < 3) return;
      var spread = Math.max.apply(null, currentFrets) - Math.min.apply(null, currentFrets);
      if (spread > 4) return;
      for (var t = 0; t < typeNames.length; t++) {
        var typeName = typeNames[t];
        var intervals = CHORD_TYPES[typeName];
        if (intervals.length !== uniqueNotes.length) continue;
        for (var r = 0; r < NOTES.length; r++) {
          if (notesMatch(uniqueNotes, NOTES[r], intervals)) {
            results.push({
              frets: currentFrets.slice(),
              notes: notes.slice(),
              root: NOTES[r],
              type: typeName,
              name: NOTES[r] + " " + typeName
            });
          }
        }
      }
      return;
    }
    for (var f = minFret; f <= maxFret; f++) {
      recurse(strPos + 1, currentFrets.concat(f));
    }
  }

  recurse(0, []);

  var seen = {};
  return results.filter(function (v) {
    var key = v.frets.join("-") + v.name;
    if (seen[key]) return false;
    seen[key] = true;
    return true;
  });
}

var state = {
  centerFret: 5,
  stringSet: "1-2-3 (e-B-G)",
  types: ["Major", "Minor"],
  root: "Hepsi"
};

function el(tag, cls, text) {
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}

function makeChip(label, active, accent, onClick) {
  var b = el("button", "chip", label);
  b.setAttribute("aria-pressed", active ? "true" : "false");
  if (active) {
    b.style.borderColor = accent;
    b.style.background = accent + "22";
    b.style.color = accent;
  }
  b.addEventListener("click", onClick);
  return b;
}

function renderTab(voicing, stringIndices) {
  var frets = voicing.frets;
  var minFret = Math.min.apply(null, frets);
  var maxFret = Math.max.apply(null, frets);
  var span = Math.max(maxFret - minFret, 3);

  var box = el("div", "tab");
  stringIndices.forEach(function (si, i) {
    var f = frets[i];
    var n = voicing.notes[i];
    var isRoot = n === voicing.root;

    var row = el("div", "tab-row");
    row.appendChild(el("span", "tab-str", STRING_LABELS[si]));
    row.appendChild(el("span", "tab-bar", "|"));
    for (var p = 0; p <= span; p++) {
      var filled = (p === f - minFret);
      var cell = el("span", "tab-cell" + (filled && isRoot ? " root" : ""));
      cell.textContent = filled ? (isRoot ? "[" + f + "]" : " " + f + " ") : "--";
      row.appendChild(cell);
    }
    row.appendChild(el("span", "tab-bar", "|"));
    row.appendChild(el("span", "tab-note" + (isRoot ? " root" : ""), n + (isRoot ? " \u2190 kök" : "")));
    box.appendChild(row);
  });
  box.appendChild(el("div", "tab-start", (minFret + ". perdeden başlar")));
  return box;
}

function render() {
  document.getElementById("fretVal").textContent = state.centerFret;

  var setsBox = document.getElementById("stringSets");
  setsBox.innerHTML = "";
  Object.keys(STRING_SETS).forEach(function (s) {
    setsBox.appendChild(makeChip(s, state.stringSet === s, "#e8b84b", function () {
      state.stringSet = s;
      render();
    }));
  });

  var typesBox = document.getElementById("chordTypes");
  typesBox.innerHTML = "";
  Object.keys(CHORD_TYPES).forEach(function (t) {
    typesBox.appendChild(makeChip(typeLabel(t), state.types.indexOf(t) !== -1, TYPE_COLORS[t].accent, function () {
      var i = state.types.indexOf(t);
      if (i === -1) state.types.push(t); else state.types.splice(i, 1);
      render();
    }));
  });

  var rootsBox = document.getElementById("roots");
  rootsBox.innerHTML = "";
  ["Hepsi"].concat(NOTES).forEach(function (n) {
    rootsBox.appendChild(makeChip(n, state.root === n, "#9bbfe8", function () {
      state.root = n;
      render();
    }));
  });

  var stringIndices = STRING_SETS[state.stringSet];
  var voicings = findVoicings(stringIndices, state.centerFret, 3);
  var filtered = voicings.filter(function (v) {
    return state.types.indexOf(v.type) !== -1 && (state.root === "Hepsi" || v.root === state.root);
  });

  var grouped = {};
  var order = [];
  filtered.forEach(function (v) {
    if (!grouped[v.name]) { grouped[v.name] = []; order.push(v.name); }
    grouped[v.name].push(v);
  });

  var fourNote = state.types.filter(function (t) { return CHORD_TYPES[t].length === 4; });
  var noticeBox = document.getElementById("notice");
  noticeBox.innerHTML = "";
  if (fourNote.length && stringIndices.length < 4) {
    var msg = fourNote.map(typeLabel).join(", ") + " dört ses ister. Görmek için 1-2-3-4 tel grubuna geçin.";
    noticeBox.appendChild(el("div", "notice", msg));
  }

  document.getElementById("count").textContent =
    order.length + " akor bulundu (" + filtered.length + " pozisyon)";

  var results = document.getElementById("results");
  results.innerHTML = "";
  order.forEach(function (name) {
    var vs = grouped[name];
    var c = TYPE_COLORS[vs[0].type] || TYPE_COLORS["Major"];
    var card = el("div", "card");
    card.style.border = "1px solid " + c.accent + "44";
    card.style.borderTop = "2px solid " + c.accent;

    var head = el("div");
    head.style.marginBottom = "12px";
    var nm = el("span", "card-name", vs[0].root + " " + typeLabel(vs[0].type));
    nm.style.color = c.label;
    head.appendChild(nm);
    head.appendChild(el("span", "card-sub", vs.length + " pozisyon"));
    card.appendChild(head);

    var list = el("div", "voicings");
    vs.slice(0, 3).forEach(function (v) {
      var w = el("div", "voicing");
      w.appendChild(renderTab(v, stringIndices));
      list.appendChild(w);
    });
    card.appendChild(list);
    results.appendChild(card);
  });

  var emptyBox = document.getElementById("empty");
  emptyBox.innerHTML = "";
  if (order.length === 0) {
    emptyBox.appendChild(el("div", "empty",
      "Bu aralıkta akor yok. Merkez perdeyi kaydırın, başka bir tel grubu seçin ya da daha çok akor türü açın."));
  }
}

document.getElementById("fret").addEventListener("input", function (e) {
  state.centerFret = Number(e.target.value);
  render();
});

render();
</script>

<script>
  // Installed or opened from the web address, the app keeps working without a connection.
  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1")){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  }
</script>
</body>
</html>
