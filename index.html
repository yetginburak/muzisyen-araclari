  }

  function fitPage(){
    var fit = document.getElementById("pageFit"), paper = document.getElementById("sheetPaper");
    if (!fit || !paper) return;
    var room = fit.parentElement.clientWidth;
    // A hidden or not yet laid out view has no width; the sheet is fitted again once it has one.
    if (room <= 0) return;
    var scale = Math.min(1, room / PAGE_W);
    paper.style.transform = scale < 1 ? "scale(" + scale.toFixed(4) + ")" : "";
    fit.style.width = (PAGE_W * scale) + "px";
    fit.style.height = (PAGE_H * scale) + "px";
  }
  window.addEventListener("resize", fitPage);
  if (window.ResizeObserver) new ResizeObserver(function(){ fitPage(); }).observe(document.getElementById("sheetHost"));

  function renderGrid(){
    var d = currentDoc;
    var head = document.getElementById("pageHead");
    if (!d || !head) return;
    geom = computeGeom(d, PAD_TOP + head.offsetHeight + HEADER_GAP);
    if (selA !== null && Math.max(selA, selB) >= d.bars.length) resetBarSelection();
    var grid = document.getElementById("pageGrid");
    grid.innerHTML = gridSvg(d, geom) + overlaysHtml(d, geom);
    Array.prototype.forEach.call(grid.querySelectorAll(".chord-slot"), fitChordText);
    wireGrid();
    updateSelectionView();
    updateToolbar();
  }

  // Re-renders without losing the chord field the user just moved into.
  function renderGridKeepFocus(){
    var a = document.activeElement;
    var i = a && a.classList && a.classList.contains("chord-slot") ? a.getAttribute("data-i") : null;
    renderGrid();
    if (i === null) return;
    var el = document.querySelector('#pageGrid .chord-slot[data-i="'+i+'"]');
    if (el){ pointerSelect = true; el.focus(); placeCaretAtEnd(el); }
  }

  // Long chord symbols shrink to fit their bar instead of spilling into the next one.
  function fitChordText(slot){
    var size = parseFloat(slot.getAttribute("data-base")) || 17;
    slot.style.fontSize = size + "px";
    while (slot.scrollWidth > slot.clientWidth + 1 && size > 10){
      size -= 0.5;
      slot.style.fontSize = size + "px";
    }
  }

  function placeCaretAtEnd(el){
    var range = document.createRange();
    range.selectNodeContents(el);
    range.collapse(false);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  // ---- selection ----
  function resetBarSelection(){ selA = null; selB = null; }
  function selRange(){ return selA === null ? null : {from: Math.min(selA, selB), to: Math.max(selA, selB)}; }

  function selectBar(i, extend){
    if (extend && selA !== null) selB = i;
    else { selA = i; selB = i; }
    updateSelectionView();
    updateToolbar();
  }

  function updateSelectionView(){
    var layer = document.getElementById("selLayer");
    if (!layer || !geom) return;
    var r = selRange(), html = "";
    if (r){
      for (var row = geom.barRow[r.from]; row <= geom.barRow[r.to]; row++){
        var info = geom.rows[row];
        var a = Math.max(r.from, info.start), z = Math.min(r.to, info.start + info.count - 1);
        if (a > z) continue;
        var box = barBox(geom, a);
        html += '<div class="sel-rect" style="left:'+px(box.x)+'px;top:'+px(box.top)+'px;width:'+px((z - a + 1) * info.mW)+'px;height:'+px(ROW_BASE * geom.s)+'px"></div>';
      }
    }
    layer.innerHTML = html;
  }

  // ---- editing ----
  function wireHeader(){
    Array.prototype.forEach.call(document.querySelectorAll("#pageHead [data-field]"), function(el){
      el.addEventListener("keydown", function(e){
        if (e.key === "Enter"){ e.preventDefault(); el.blur(); }
      });
      el.addEventListener("blur", function(){
        var field = el.getAttribute("data-field");
        var text = el.textContent.trim();
        if (text === "—") text = "";
        if ((currentDoc[field] || "") === text) return;
        var patch = {};
        patch[field] = text;
        saveDoc(patch);
        renderGrid();
      });
    });
  }

  function clearRepeatSign(slot){
    slot.classList.remove("is-repeat");
    var sign = document.querySelector('#pageGrid g[data-sign="'+slot.getAttribute("data-i")+'"]');
    if (sign) sign.remove();
  }

  // Offered only on an empty bar that has a bar before it.
  function updateSimileBtn(slot){
    var btn = document.querySelector("#sheetPaper .simile-btn");
    var i = parseInt(slot.getAttribute("data-i"), 10);
    if (slot.textContent.trim() !== "" || i === 0){ btn.hidden = true; return; }
    simileTarget = slot;
    var box = barBox(geom, i);
    btn.style.left = px(box.x + box.mW / 2) + "px";
    btn.style.top = px(box.staffTop + (STAFF_H + 5) * geom.s) + "px";
    btn.hidden = false;
  }

  function wireGrid(){
    var grid = document.getElementById("pageGrid");
    var simileBtn = document.querySelector("#sheetPaper .simile-btn");

    Array.prototype.forEach.call(grid.querySelectorAll(".bar-cell"), function(cell){
      cell.addEventListener("pointerdown", function(e){
        e.preventDefault();
        var a = document.activeElement;
        if (a && a.classList && a.classList.contains("chord-slot")) a.blur();
        selectBar(parseInt(cell.getAttribute("data-i"), 10), e.shiftKey);
      });
    });

    Array.prototype.forEach.call(grid.querySelectorAll(".chord-slot"), function(slot){
      var i = parseInt(slot.getAttribute("data-i"), 10);
      slot.addEventListener("pointerdown", function(e){
        pointerSelect = true;
        if (e.shiftKey && selA !== null){ e.preventDefault(); selectBar(i, true); return; }
        selectBar(i, false);
      });
      slot.addEventListener("focus", function(){
        if (!pointerSelect) selectBar(i, false);
        pointerSelect = false;
        updateSimileBtn(slot);
      });
      slot.addEventListener("keydown", function(e){
        if (e.key === "Enter"){ e.preventDefault(); slot.blur(); return; }
        // On a repeat bar the hidden "%" is replaced by what is typed, or cleared.
        if (!slot.classList.contains("is-repeat") || e.ctrlKey || e.metaKey || e.altKey) return;
        if (e.key === "Backspace" || e.key === "Delete"){
          e.preventDefault();
          slot.textContent = "";
          clearRepeatSign(slot);
          updateSimileBtn(slot);
        } else if (e.key.length === 1){
          e.preventDefault();
          slot.textContent = e.key;
          clearRepeatSign(slot);
          placeCaretAtEnd(slot);
          updateSimileBtn(slot);
        }
      });
      slot.addEventListener("input", function(){
        var typed = slot.textContent.trim();
        if (slot.classList.contains("is-repeat") && typed !== "%" && typed !== "-") clearRepeatSign(slot);
        fitChordText(slot);
        updateSimileBtn(slot);
      });
      slot.addEventListener("blur", function(){
        simileBtn.hidden = true;
        var text = slot.textContent.trim();
        var bars = currentDoc.bars;
        if (!bars[i]) return;
        var before = bars[i].chord;
        if (isRepeatMeasure(text)) text = "%";
        else if (isRestMeasure(text)) text = "-";
        if (bars[i].chord === text) return;
        var changed = clone(bars);
        changed[i].chord = text;
        saveDoc({bars: changed});
        // Repeat and rest signs are drawn on the staff, so moving to or from one redraws the bar.
        var signBefore = isRepeatMeasure(before) || isRestMeasure(before), signNow = text === "%" || text === "-";
        if (signBefore || signNow || slot.classList.contains("rhythmic")) setTimeout(renderGridKeepFocus, 0);
      });
    });

    simileBtn.onpointerdown = function(e){ e.preventDefault(); };
    simileBtn.onclick = function(){
      if (!simileTarget) return;
      simileTarget.textContent = "%";
      simileTarget.blur();
    };
  }

  function renderRhythmPanel(){
    var panel = document.getElementById("rhythmPanel");
    var r = selRange(), cells = currentDoc && r ? barCellsAt(currentDoc, r.from) : 0;
    panel.hidden = !rhythmOpen || !r || !cells;
    if (panel.hidden) return;
    var pattern = (currentDoc.bars[r.from].rhythm || "").slice(0, cells);
    while (pattern.length < cells) pattern += ".";
    document.getElementById("rpInfo").textContent = r.from === r.to ? (r.from + 1) + ". ölçü" : (r.from + 1) + "–" + (r.to + 1) + ". ölçüler, hepsine uygulanır";
    var active = document.activeElement;
    var focusedK = active && active.classList && active.classList.contains("rp-cell") ? active.getAttribute("data-k") : null;
    var names = {".": "boş", "x": "vuruş", "X": "aksanlı vuruş", "-": "sus"};
    var html = "";
    for (var beat = 0; beat < cells / 4; beat++){
      html += '<div class="rp-beat">';
      for (var k = beat * 4; k < beat * 4 + 4; k++){
        var c = pattern.charAt(k), sub = ["", "e", "&", "a"][k % 4];
        html += '<button type="button" class="rp-cell'+(sub ? "" : " on-beat")+'" data-k="'+k+'" data-state="'+c+'" '+
          'aria-label="'+(beat + 1)+(sub ? " " + sub : ". vuruş")+': '+names[c]+'" title="'+names[c]+'">'+
          '<span class="rp-mark">'+(c === "X" ? "&gt;" : "")+'</span><span>'+(sub || (beat + 1))+'</span></button>';
      }
      html += '</div>';
    }
    var grid = document.getElementById("rpGrid");
    grid.innerHTML = html;
    var bar = currentDoc.bars[r.from], hasPattern = /[xX-]/.test(bar.rhythm || "") || bar.tieIn;

    toggle.disabled = !hasPattern;
    toggle.setAttribute("aria-pressed", String(hasPattern && !bar.rhythmOff));
    toggle.textContent = hasPattern && bar.rhythmOff ? "Ritmi aç" : "Ritmi kapat";
    toggle.title = !hasPattern ? "Önce bir ritim işaretleyin" : (bar.rhythmOff ? "Saklanan ritmi yeniden göster" : "Ritmi gizle, yazılan ritim saklanır");
    if (focusedK !== null){
      var again = grid.querySelector('[data-k="'+focusedK+'"]');
      if (again) again.focus();
    }
  }

  function editBars(fn){
    if (!currentDoc || view !== "songs") return;
    var r = selRange();
    var bars = clone(currentDoc.bars);
    if (fn(bars, r) === false) return;
    saveDoc({bars: bars});

  function setLayout(field, value, lo, hi){
    if (!currentDoc || view !== "songs") return;
    var layout = clone(currentDoc.layout);
    layout[field] = clampInt(value, lo, hi, layout[field]);
    // Setting the bar count for all lines also drops the lines' own counts.
    if (field === "perLine") layout.rowCounts = [];
    if (JSON.stringify(layout) === JSON.stringify(currentDoc.layout)) return;
    saveDoc({layout: layout});
    renderGrid();
  }

  (function initToolbar(){
    var times = document.getElementById("tbTimes");
    for (var k = 2; k <= 8; k++) times.insertAdjacentHTML("beforeend", '<option value="'+k+'">'+k+'x</option>');
    document.getElementById("tbEnding").innerHTML = ENDINGS.map(function(e){

    }).join("");

    // The line count never goes below what the bars need; the page fits them anyway.

    document.getElementById("trimLines").addEventListener("click", function(){ if (geom) setLayout("lines", geom.needed, 1, 30); });
    document.getElementById("linesInc").addEventListener("click", function(){ if (geom) setLayout("lines", geom.lines + 1, 1, 30); });
    document.getElementById("perLineDec").addEventListener("click", function(){ if (currentDoc) setLayout("perLine", currentDoc.layout.perLine - 1, 1, 8); });

    note.addEventListener("input", function(){ editBars(function(bars, r){ if (!r) return false; bars[r.from].note = note.value; }); });

    document.getElementById("tbRepeatStart").addEventListener("click", function(){
      editBars(function(bars, r){ if (!r) return false; bars[r.from].repeatStart = !bars[r.from].repeatStart; });

    var ending = document.getElementById("tbEnding");

    document.getElementById("tbSegno").addEventListener("click", function(){
      editBars(function(bars, r){ if (!r) return false; bars[r.from].startMark = bars[r.from].startMark === "segno" ? "" : "segno"; });
    });
    document.getElementById("tbCoda").addEventListener("click", function(){
      editBars(function(bars, r){ if (!r) return false; bars[r.from].startMark = bars[r.from].startMark === "coda" ? "" : "coda"; });
    });
    var meterSel = document.getElementById("tbMeter");
    meterSel.innerHTML = METERS.map(function(m){
      return '<option value="'+m+'">'+(m ? m : "Ölçü sayısı")+'</option>';
    }).join("");
    // The selected bars take the new time signature and the bar after them returns to the old one,
    // so a single 2/4 bar inside a 4/4 song reads 2/4 ... 4/4 as it is written by hand.
    meterSel.addEventListener("change", function(){
      editBars(function(bars, r){
        if (!r) return false;
        var songMeter = currentDoc.timeSig, after = meterAt(bars, songMeter, r.to + 1);
        for (var i = r.from; i <= r.to; i++) bars[i].timeSig = "";
        bars[r.from].timeSig = meterSel.value;
        if (meterSel.value && bars[r.to + 1] && !bars[r.to + 1].timeSig) bars[r.to + 1].timeSig = after;
        // Changes that repeat the meter already in force say nothing, so they are dropped.
        for (var k = 0; k < bars.length; k++){
          if (bars[k].timeSig && bars[k].timeSig === meterAt(bars, songMeter, k - 1)) bars[k].timeSig = "";
        }
      });
    });
    var endMark = document.getElementById("tbEndMark");
    endMark.addEventListener("change", function(){
      editBars(function(bars, r){ if (!r) return false; bars[r.to].endMark = endMark.value; });
    });
    document.getElementById("tbAddBar").addEventListener("click", addBarAfterSelection);
    document.getElementById("tbDelBars").addEventListener("click", deleteSelectedBars);
    document.getElementById("tbLineAbove").addEventListener("click", function(){ insertLine(false); });
    document.getElementById("tbLineBelow").addEventListener("click", function(){ insertLine(true); });

    document.getElementById("tbRhythm").addEventListener("click", function(){
      rhythmOpen = !rhythmOpen;
      updateToolbar();
      if (rhythmOpen){
        var first = document.querySelector("#rpGrid .rp-cell");

      rhythmOpen = false;
      updateToolbar();

    });
    document.getElementById("rpTie").addEventListener("click", function(){
      editBars(function(bars, r){
        if (!r) return false;
        var on = !bars[r.from].tieIn;
        for (var i = r.from; i <= r.to; i++){ bars[i].tieIn = on; if (on) bars[i].rhythmOff = false; }
      });
    });
    // Turning a rhythm off hides it but keeps what was written, so turning it on brings it back.
    document.getElementById("rpToggle").addEventListener("click", function(){
      editBars(function(bars, r){
        if (!r) return false;
        var off = !bars[r.from].rhythmOff;
        for (var i = r.from; i <= r.to; i++) bars[i].rhythmOff = off;
      });
    });
    document.getElementById("rpGrid").addEventListener("click", function(e){
      var cell = e.target.closest(".rp-cell");
      if (!cell || !currentDoc) return;
      var picked = selRange(), k = parseInt(cell.getAttribute("data-k"), 10), cells = picked ? barCellsAt(currentDoc, picked.from) : 0;
      cell.focus();
      editBars(function(bars, r){
        if (!r || !cells) return false;
        var p = (bars[r.from].rhythm || "").slice(0, cells);
        while (p.length < cells) p += ".";
        var next = RHYTHM_STATES[(RHYTHM_STATES.indexOf(p.charAt(k)) + 1) % RHYTHM_STATES.length];
        p = p.slice(0, k) + next + p.slice(k + 1);
        var value = /[xX-]/.test(p) ? p : "";
        for (var i = r.from; i <= r.to; i++){ bars[i].rhythm = value; bars[i].rhythmOff = false; }
      });
    });
  })();

  // ---- PDF ----
  // Inside Claude the browser print dialog is not available, so the sheet is drawn into an A4 PDF
  // and offered as a file to save. Outside Claude the ordinary print dialog is used.
  var PDF_LIBS = [
    "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js",
    "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"
  ];
  var pdfLibs = null, downloadsApi = null;

  function loadScript(url){
    return new Promise(function(resolve, reject){
      var el = document.createElement("script");
      el.src = url;
      el.onload = resolve;
      el.onerror = function(){ reject(new Error("load")); };
      document.head.appendChild(el);
    });
  }
  function loadPdfLibs(){
    if (!pdfLibs){
      pdfLibs = loadScript(PDF_LIBS[0]).then(function(){ return loadScript(PDF_LIBS[1]); });
      pdfLibs.catch(function(){ pdfLibs = null; });
    }
    return pdfLibs;
  }
  function getDownloads(){
    if (!downloadsApi){
      downloadsApi = window.claude && window.claude.use
        ? Promise.resolve(window.claude.use("downloads")).catch(function(){ return null; })
        : Promise.resolve(null);
    }
    return downloadsApi;
  }
  // "Meli - Fell in Love with a Boy (Joss Stone).pdf" for a song, "Meli - setlist name.pdf" for a setlist.
  function pdfFileName(){
    var project = (artists.filter(function(a){ return a.id === currentArtistId; })[0] || {}).name || "";
    var main = currentDoc && (currentDoc.title || currentDoc.name) || "Repertuar";
    var original = view === "songs" && currentDoc && currentDoc.artist ? String(currentDoc.artist).trim() : "";
    if (original && original !== project) main += " (" + original + ")";
    var name = project ? project + " - " + main : main;
    return String(name).replace(/[\\\/:*?"<>|]+/g, " ").replace(/\s+/g, " ").trim().slice(0, 120) + ".pdf";
  }

  function sheetToPdf(paper){
    var restore = paper.style.transform;
    paper.style.transform = "";
    // Text inside the drawing (clefs, time signatures, ending numbers) loses its web font when the
    // drawing is turned into a picture, so it is laid over the picture as ordinary page text.
    var origin = paper.getBoundingClientRect();
    var glyphs = Array.prototype.map.call(paper.querySelectorAll("svg text"), function(t){
      var b = t.getBoundingClientRect(), cs = getComputedStyle(t);
      return {left: b.left - origin.left, top: b.top - origin.top, height: b.height, text: t.textContent,
        family: cs.fontFamily, size: parseFloat(t.getAttribute("font-size")) || parseFloat(cs.fontSize), weight: cs.fontWeight, style: cs.fontStyle};
    });
    return window.html2canvas(paper, {
      scale: 3, backgroundColor: "#ffffff", logging: false, useCORS: true,
      onclone: function(doc){
        var style = doc.createElement("style");
        style.textContent = ".sel-layer,.simile-btn,.page-help{display:none!important}svg text{fill:transparent!important}" +
          ".chord-slot:focus{background:none!important}#sheetPaper{box-shadow:none!important;border-radius:0!important;background:#fff!important}";
        doc.head.appendChild(style);
        var host = doc.getElementById("sheetPaper");
        glyphs.forEach(function(g){
          var el = doc.createElement("div");
          el.textContent = g.text;
          el.style.cssText = "position:absolute;white-space:nowrap;pointer-events:none;color:#20232c;left:" + g.left + "px;top:" + g.top + "px;height:" + g.height +
            "px;line-height:" + g.height + "px;font-size:" + g.size + "px;font-weight:" + g.weight + ";font-style:" + g.style + ";font-family:" + g.family;
          host.appendChild(el);
        });
      }
    }).then(function(canvas){
      paper.style.transform = restore;
      var pdf = new window.jspdf.jsPDF({unit: "mm", format: "a4", orientation: "portrait", compress: true});
      var pageW = 210, pageH = 297, imgH = canvas.height * pageW / canvas.width;
      var img = canvas.toDataURL("image/jpeg", 0.92);
      pdf.addImage(img, "JPEG", 0, 0, pageW, imgH);
      // A long setlist continues on further pages.
      for (var y = -pageH; imgH + y > 1; y -= pageH){
        pdf.addPage();
        pdf.addImage(img, "JPEG", 0, y, pageW, imgH);
      }
      return pdf.output("blob");
    }, function(err){
      paper.style.transform = restore;
      throw err;
    });
  }

  function exportPdf(){
    var paper = document.getElementById("sheetPaper");
    if (!currentDoc || !paper) return;
    var active = document.activeElement;
    if (active && active.closest && active.closest("#sheetHost")) active.blur();
    var btn = document.getElementById("printBtn");
    getDownloads().then(function(downloads){
      if (!downloads){ window.print(); return; }
      btn.disabled = true;
      setStatus("PDF hazırlanıyor…", "");
      return loadPdfLibs().then(function(){
        return document.fonts ? document.fonts.ready : null;
      }).then(function(){
        return sheetToPdf(paper);
      }).then(function(blob){
        return downloads.save({filename: pdfFileName(), data: blob}).then(function(){
          setStatus("PDF hazır: " + pdfFileName(), "");
        }, function(err){
          var code = err && err.code;
          if (code === "declined") setStatus("PDF kaydedilmedi", "");
          else if (code === "rate_limited") setStatus("Kaydetme penceresi zaten açık", "");
          else setStatus("PDF kaydedilemedi (" + (code || "hata") + ")", "error");
        });
      }, function(){
        setStatus("PDF hazırlanamadı — bağlantıyı kontrol edip tekrar deneyin.", "error");
      }).then(function(){
        btn.disabled = false;
      });
    });
  }
  document.getElementById("printBtn").addEventListener("click", exportPdf);

  // ---- sharing songs and setlists as files ----
  // A song, a setlist with its songs, or everything can be written to a .json file and added
  // on another device or by another person, like sending a document.
  var FILE_FORMAT = "setlist-defteri";
  var SONG_FIELDS = ["title", "artist", "key", "tempo", "timeSig", "bars", "layout", "systems"];

  function fileBaseName(){ return pdfFileName().replace(/\.pdf$/, ""); }
  function normTitle(t){ return String(t || "").trim().toLocaleLowerCase("tr"); }
  function songBody(v){
    var out = {};
    SONG_FIELDS.forEach(function(k){ if (v && v[k] !== undefined) out[k] = clone(v[k]); });
    if (typeof out.title !== "string") out.title = "İsimsiz şarkı";
    return out;
  }
  function inSequence(items, fn){
    return items.reduce(function(p, item, i){ return p.then(function(acc){ return Promise.resolve(fn(item, i)).then(function(r){ acc.push(r); return acc; }); }); }, Promise.resolve([]));
  }
  function readSong(id){
    if (selectedId === id && currentDoc && view === "songs") return Promise.resolve(clone(currentDoc));
    return db.doc("songs/" + id).get().then(function(s){ return s.exists ? s.data() : null; });
  }

  function saveFile(filename, text){
    var blob = new Blob([text], {type: "application/json"});
    return getDownloads().then(function(downloads){
      if (downloads) return downloads.save({filename: filename, data: blob});
      // On a phone the file goes to the share sheet (WhatsApp, e-mail…); elsewhere it downloads.
      try {
        var file = new File([blob], filename, {type: "application/json"});
        if (/Android|iPhone|iPad|iPod/i.test(navigator.userAgent) && navigator.canShare && navigator.canShare({files: [file]})){
          return navigator.share({files: [file], title: filename});
        }
      } catch(err){}
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 2000);
    });
  }
  function reportSave(p, done){
    return p.then(function(){ setStatus(done, ""); }, function(err){
      var code = err && (err.code || err.name);
      if (code === "declined" || code === "AbortError") setStatus("Dosya kaydedilmedi", "");
      else setStatus("Dosya kaydedilemedi (" + (code || "hata") + ")", "error");
    });
  }

  function exportCurrent(){
    if (!currentDoc || !selectedId) return;
    var active = document.activeElement;
    if (active && active.closest && active.closest("#sheetHost")) active.blur();
    var name = fileBaseName() + ".json", stamp = new Date().toISOString();
    if (view === "songs"){
      var payload = {format: FILE_FORMAT, version: 1, kind: "song", exportedAt: stamp, song: songBody(currentDoc)};
      reportSave(saveFile(name, JSON.stringify(payload)), "Paylaşım dosyası hazır: " + name);
      return;
    }
    var ids = currentDoc.songIds.slice();
    inSequence(ids, readSong).then(function(docs){
      var songs = [], order = [];
      docs.forEach(function(d, i){ if (d){ order.push(songs.length); songs.push(songBody(d)); } });
      var payload = {format: FILE_FORMAT, version: 1, kind: "setlist", exportedAt: stamp,
        setlist: {name: currentDoc.name || "Setlist"}, songs: songs};
      return reportSave(saveFile(name, JSON.stringify(payload)), "Paylaşım dosyası hazır: " + name);
    });
  }

  function backupAll(){
    if (!db) return;
    if (dirty && !confirm("Kaydedilmemiş değişiklikler yedeğe girmez. Yine de yedeklensin mi?")) return;
    inSequence(songsAll, function(s){ return readSong(s.id).then(function(d){ return d ? {id: s.id, artistId: songArtistId(s), order: s.order, doc: d} : null; }); })
      .then(function(list){
        var payload = {format: FILE_FORMAT, version: 1, kind: "backup", exportedAt: new Date().toISOString(),
          artists: artists.map(function(a){ return {key: a.id, name: a.name, order: a.order}; }),
          songs: list.filter(Boolean).map(function(x){ var b = songBody(x.doc); b.key_ = x.id; b.artistKey = x.artistId; b.order = x.order; return b; }),
          setlists: setlistsAll.map(function(l){ return {artistKey: l.artistId, name: l.name, songKeys: l.songIds.slice(), createdAt: l.createdAt}; })};
        var d = new Date(), day = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
        var name = "Repertuar yedeği " + day + ".json";
        return reportSave(saveFile(name, JSON.stringify(payload)), "Yedek hazır: " + name);
      });
  }

  // Songs land under one artist. A song with the same title there is replaced or kept, as chosen.
  function importSongs(list, artistId, sameTitle){
    var existing = songsAll.filter(function(s){ return songArtistId(s) === artistId; });
    var nextOrder = existing.reduce(function(m, s){ return Math.max(m, s.order || 0); }, 0);
    return inSequence(list, function(song){
      var body = songBody(song);
      var match = existing.filter(function(s){ return normTitle(s.title) === normTitle(body.title); })[0];
      if (match && sameTitle === "keep") return match.id;
      if (match && sameTitle === "replace"){
        body.artistId = artistId;
        body.order = match.order;
        return db.doc("songs/" + match.id).set(body).then(function(){ return match.id; });
      }
      if (match && sameTitle === "copy") body.title += " (kopya)";
      body.artistId = artistId;
      body.order = ++nextOrder;
      var ref = db.collection("songs").doc();
      return ref.set(body).then(function(){ return ref.id; });
    });
  }
  function duplicateCount(list, artistId){
    var titles = {};
    songsAll.forEach(function(s){ if (songArtistId(s) === artistId) titles[normTitle(s.title)] = true; });
    return list.filter(function(s){ return titles[normTitle(s && s.title)]; }).length;
  }

  function importFile(text){
    var data;
    try { data = JSON.parse(text); } catch(err){ data = null; }
    if (!data || data.format !== FILE_FORMAT){
      alertStatus("Bu dosya bir Setlist Defteri dosyası değil.");
      return;
    }
    if (data.kind === "backup") return importBackup(data);
    if (!currentArtistId){ alertStatus("Önce bir sanatçı ya da proje seçin."); return; }
    var artistName = (currentArtist() || {}).name || "";
    if (data.kind === "song" && data.song){
      var policy = "new";
      if (duplicateCount([data.song], currentArtistId)){
        policy = confirm("“" + data.song.title + "” " + artistName + " listesinde zaten var.\n\nTamam: mevcut şarkının yerine yaz\nİptal: ayrı bir kopya olarak ekle") ? "replace" : "copy";
      }
      return importSongs([data.song], currentArtistId, policy).then(function(ids){
        switchView("songs");
        selectItem(ids[0], true);
        setStatus("Eklendi: " + data.song.title, "");
      });
    }
    if (data.kind === "setlist" && Array.isArray(data.songs)){
      var dup = duplicateCount(data.songs, currentArtistId);
      var keepOrReplace = dup && !confirm("Bu setlistteki " + dup + " şarkı " + artistName + " listesinde zaten var.\n\nTamam: dosyadaki hâlleriyle değiştir\nİptal: listedeki hâllerini koru") ? "keep" : "replace";
      return importSongs(data.songs, currentArtistId, keepOrReplace).then(function(ids){
        var ref = db.collection("setlists").doc();
        var name = data.setlist && data.setlist.name || "Setlist";
        return ref.set({artistId: currentArtistId, name: name, songIds: ids, createdAt: new Date().toISOString()}).then(function(){
          switchView("setlists");
          selectItem(ref.id, true);
          setStatus("Eklendi: " + name + " (" + ids.length + " şarkı)", "");
        });
      });
    }
    alertStatus("Dosyada eklenecek bir şey bulunamadı.");
  }

  function importBackup(data){
    var fileArtists = Array.isArray(data.artists) ? data.artists : [];
    var fileSongs = Array.isArray(data.songs) ? data.songs : [];
    var fileSetlists = Array.isArray(data.setlists) ? data.setlists : [];
    if (!confirm("Yedekte " + fileArtists.length + " sanatçı, " + fileSongs.length + " şarkı ve " + fileSetlists.length + " setlist var.\n" +
      "Aynı adlı sanatçıların altına eklenecek; olmayanlar oluşturulacak. Devam edilsin mi?")) return;
    var dupTotal = 0;
    fileArtists.forEach(function(fa){
      var local = artists.filter(function(a){ return normTitle(a.name) === normTitle(fa.name); })[0];
      if (local) dupTotal += duplicateCount(fileSongs.filter(function(s){ return s.artistKey === fa.key; }), local.id);
    });
    var policy = dupTotal && !confirm(dupTotal + " şarkı listelerinizde zaten var.\n\nTamam: yedekteki hâlleriyle değiştir\nİptal: listedeki hâllerini koru") ? "keep" : "replace";
    var artistMap = {}, songMap = {};
    var nextArtistOrder = artists.reduce(function(m, a){ return Math.max(m, a.order || 0); }, 0);
    return inSequence(fileArtists, function(fa){
      var local = artists.filter(function(a){ return normTitle(a.name) === normTitle(fa.name); })[0];
      if (local){ artistMap[fa.key] = local.id; return; }
      var ref = db.collection("artists").doc();
      artistMap[fa.key] = ref.id;
      return ref.set({name: fa.name || "İsimsiz", order: ++nextArtistOrder});
    }).then(function(){
      return inSequence(fileArtists, function(fa){
        var own = fileSongs.filter(function(s){ return s.artistKey === fa.key; });
        return importSongs(own, artistMap[fa.key], policy).then(function(ids){
          own.forEach(function(s, i){ songMap[s.key_] = ids[i]; });
        });
      });
    }).then(function(){
      return inSequence(fileSetlists, function(l){
        var artistId = artistMap[l.artistKey];
        if (!artistId) return;
        // The same backup loaded twice does not duplicate its setlists.
        if (setlistsAll.some(function(x){ return x.artistId === artistId && normTitle(x.name) === normTitle(l.name); })) return;
        var ref = db.collection("setlists").doc();
        return ref.set({artistId: artistId, name: l.name || "Setlist",
          songIds: (l.songKeys || []).map(function(k){ return songMap[k]; }).filter(Boolean), createdAt: l.createdAt || new Date().toISOString()});
      });
    }).then(function(){
      alertStatus("Yedek yüklendi: " + fileSongs.length + " şarkı, " + fileSetlists.length + " setlist.");
    });
  }

  // The toolbar may be hidden when nothing is open, so messages also show in the empty view.
  function alertStatus(msg){
    setStatus(msg, "");
    if (document.getElementById("toolbar").hidden) showEmpty(msg);
  }

  // ---- deleting ----
  // Deletion cannot be undone, so each one asks first and says what else goes with it.
  function deleteCurrentItem(){
    if (!db || !currentDoc || !selectedId) return;
    var id = selectedId;
    if (view === "songs"){
      var title = currentDoc.title || "İsimsiz şarkı";
      var inLists = setlistsAll.filter(function(l){ return l.songIds.indexOf(id) >= 0; });
      var msg = "“" + title + "” şarkısı silinsin mi?" +
        (inLists.length ? "\n\nŞarkı " + inLists.length + " setlistten de çıkarılacak." : "") + "\n\nBu işlem geri alınamaz.";
      if (!confirm(msg)) return;
      closeCurrent();
      Promise.all(inLists.map(function(l){
        return db.doc("setlists/" + l.id).update({songIds: l.songIds.filter(function(x){ return x !== id; })});
      })).then(function(){ return db.doc("songs/" + id).delete(); })
        .then(function(){ missingIds[id] = true; renderList(); ensureSelection(); if (!selectedId) renderMain(); })
        .catch(function(){ alertStatus("Şarkı silinemedi — tekrar deneyin."); });
      return;
    }
    var name = currentDoc.name || "İsimsiz setlist";
    if (!confirm("“" + name + "” setlisti silinsin mi?\n\nŞarkılar listede kalır. Bu işlem geri alınamaz.")) return;
    closeCurrent();
    db.doc("setlists/" + id).delete()
      .then(function(){ missingIds[id] = true; renderList(); ensureSelection(); if (!selectedId) renderMain(); })
      .catch(function(){ alertStatus("Setlist silinemedi — tekrar deneyin."); });
  }

  function deleteCurrentArtist(){
    var artist = currentArtist();
    if (!db || !artist) return;
    var songs = artistSongs(), lists = artistSetlists();
    var msg = "“" + artist.name + "” silinsin mi?" +
      (songs.length || lists.length ? "\n\nİçindeki " + songs.length + " şarkı ve " + lists.length + " setlist de silinecek." : "") +
      "\n\nBu işlem geri alınamaz. Emin değilseniz önce Tümünü yedekle ile yedek alın.";
    if (!confirm(msg)) return;
    closeCurrent();
    var writes = songs.map(function(s){ return db.doc("songs/" + s.id).delete(); })
      .concat(lists.map(function(l){ return db.doc("setlists/" + l.id).delete(); }));
    Promise.all(writes).then(function(){ return db.doc("artists/" + artist.id).delete(); }).then(function(){
      try { if (localStorage.getItem(ARTIST_PREF_KEY) === artist.id) localStorage.removeItem(ARTIST_PREF_KEY); } catch(err){}
      currentArtistId = null;
      lastSelected = {songs: null, setlists: null};
    }).catch(function(){ alertStatus("Silinemedi — tekrar deneyin."); });
  }

  document.getElementById("deleteItemBtn").addEventListener("click", deleteCurrentItem);
  document.getElementById("deleteArtistBtn").addEventListener("click", deleteCurrentArtist);
  document.getElementById("exportBtn").addEventListener("click", exportCurrent);
  document.getElementById("backupBtn").addEventListener("click", backupAll);
  document.getElementById("importBtn").addEventListener("click", function(){
    if (dirty && !confirm(leaveMessage())) return;
    document.getElementById("importFile").click();
  });
  document.getElementById("importFile").addEventListener("change", function(e){
    var file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    if (dirty){ closeCurrent(); }
    var reader = new FileReader();
    reader.onload = function(){ importFile(String(reader.result || "")); };
    reader.onerror = function(){ alertStatus("Dosya okunamadı."); };
    reader.readAsText(file);
  });
  document.getElementById("saveBtn").addEventListener("click", saveNow);
  document.getElementById("undoBtn").addEventListener("click", undo);
  document.getElementById("redoBtn").addEventListener("click", redo);
  document.addEventListener("keydown", function(e){
    if ((e.ctrlKey || e.metaKey) && (e.key === "s" || e.key === "S")){ e.preventDefault(); saveNow(); }
    var key = String(e.key).toLowerCase();
    if ((e.ctrlKey || e.metaKey) && !e.altKey && (key === "z" || key === "y")){
      // While text is being typed, Ctrl+Z stays the ordinary text undo of that field.
      var t = e.target;
      if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
      if (!currentDoc) return;
      e.preventDefault();
      if (key === "y" || e.shiftKey) redo(); else undo();
    }
    if (e.key === "Escape" && view === "songs" && selA !== null){
      resetBarSelection();
      updateSelectionView();
      updateToolbar();
    }
  });
  window.addEventListener("beforeunload", function(e){
    if (dirty){ e.preventDefault(); e.returnValue = ""; }
  });

  // ---- copy and paste bars ----
  // Ctrl+C on selected bars copies their chords and rhythms; Ctrl+V writes them over the bars
  // from the selection onwards. Section names, notes, repeats and endings stay where they are.
  // Text selected inside a chord or a menu field keeps the ordinary text copy and paste.
  var BAR_CLIP_TYPE = "application/x-setlist-defteri-bars";
  var barClipboard = null;

  function selectingText(el){
    if (!el) return false;
    if (el.tagName === "INPUT" || el.tagName === "TEXTAREA" || el.tagName === "SELECT") return true;
    if (el.isContentEditable){
      var sel = window.getSelection();
      return !!(sel && !sel.isCollapsed);
    }
    return false;
  }

  function pasteBars(picked, r){
    var bars = clone(currentDoc.bars);
    var span = r.to - r.from + 1;
    // A selection that is a whole multiple of the copied bars is filled by repeating them.
    var total = span > picked.length && span % picked.length === 0 ? span : picked.length;
    for (var k = 0; k < total; k++){
      var at = r.from + k, from = picked[k % picked.length];
      if (at >= bars.length) bars.push(blankBar());
      bars[at].chord = typeof from.chord === "string" ? from.chord : "";
      bars[at].rhythm = typeof from.rhythm === "string" && /^[.xX-]{0,32}$/.test(from.rhythm) ? from.rhythm : "";
      bars[at].rhythmOff = !!from.rhythmOff;
      bars[at].tieIn = !!from.tieIn;
    }
    selA = r.from;
    selB = r.from + total - 1;
    saveDoc({bars: bars});
    renderGrid();
  }

  document.addEventListener("copy", function(e){
    if (view !== "songs" || !currentDoc || !e.clipboardData) return;
    var r = selRange();
    if (!r || selectingText(document.activeElement)) return;
    var picked = currentDoc.bars.slice(r.from, r.to + 1).map(function(b){
      return {chord:b.chord, rhythm:b.rhythm, rhythmOff:b.rhythmOff, tieIn:b.tieIn};
    });
    var text = picked.map(function(b){ return b.chord || "—"; }).join(" | ");
    barClipboard = {text:text, bars:picked};
    e.clipboardData.setData("text/plain", text);
    try { e.clipboardData.setData(BAR_CLIP_TYPE, JSON.stringify(picked)); } catch(err){}
    e.preventDefault();
    document.getElementById("selInfo").textContent = picked.length + " ölçü kopyalandı";
  });

  document.addEventListener("paste", function(e){
    if (view !== "songs" || !currentDoc || !e.clipboardData) return;
    var r = selRange(), active = document.activeElement;
    if (!r || (active && (active.tagName === "INPUT" || active.tagName === "TEXTAREA"))) return;
    var picked = null;
    try {
      var raw = e.clipboardData.getData(BAR_CLIP_TYPE);
      if (raw) picked = JSON.parse(raw);
    } catch(err){}
    if (!picked && barClipboard && e.clipboardData.getData("text/plain") === barClipboard.text) picked = barClipboard.bars;
    // Anything else is ordinary text and pastes into the chord being typed.
    if (!Array.isArray(picked) || !picked.length) return;
    e.preventDefault();
    if (active && active.isContentEditable) active.blur();
    pasteBars(picked, selRange() || r);
  });

  boot();
})();
</script>

  // Installed or opened from the web address, the app keeps working without a connection.
  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1")){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  }
</script>
