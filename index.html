<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14161b">
<title>Müzisyen araçları</title>
<style>
  body{margin:0;background:#14161b;color:#f2f0e8;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .wrap{width:100%;max-width:560px}
  h1{font-size:20px;letter-spacing:.12em;text-transform:uppercase;color:#c79a45;margin:0 0 24px}
  a.card{display:flex;gap:16px;align-items:center;text-decoration:none;color:inherit;background:#1c1f27;border:1px solid #343a47;border-radius:10px;padding:16px;margin-bottom:12px}
  a.card:hover{border-color:#c79a45}
  img{width:56px;height:56px;border-radius:12px;flex:none}
  .name{font-weight:600}
  .desc{color:#9aa0ad;font-size:14px}
  p.note{color:#9aa0ad;font-size:13px;margin-top:20px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Müzisyen araçları</h1>
  <a class="card" href="defter/"><img src="defter/icon-192.png" alt=""><span><span class="name">Repertuar Defteri</span><br><span class="desc">Şifre sayfaları ve setlistler</span></span></a>
  <a class="card" href="triad/"><img src="triad/icon-192.png" alt=""><span><span class="name">Triad ve Akor Bulucu</span><br><span class="desc">Gitar klavyesinde akor pozisyonları</span></span></a>
  <p class="note">Her uygulamayı açtığınız sayfadan telefonunuza ya da bilgisayarınıza ayrı ayrı kurabilirsiniz.</p>
</div>
</body>
</html>
