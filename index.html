<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14161b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Repertuar">
<style>html{color-scheme:light}body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif;background:#14161b}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<meta charset="utf-8">
<title>Repertuar Defteri</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,600;1,9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&family=Noto+Music&display=swap">
<style>
  :root{
    --shell:#14161b;
    --panel:#1c1f27;
    --panel-2:#242833;
    --line:#343a47;
    --brass:#c79a45;
    --brass-dim:#8a6f39;
    --ink:#20232c;
    --paper:#f2f1ea;
    --paper-2:#e9e7dc;
    --text-hi:#f2f0e8;
    --text-lo:#9aa0ad;
  }
  *{box-sizing:border-box;}
  [hidden]{display:none !important;}
  body{
    margin:0;
    background:var(--shell);
    color:var(--text-hi);
    font-family:"IBM Plex Sans",system-ui,sans-serif;
    min-height:100vh;
  }
  .app{
    display:grid;
    grid-template-columns:270px 1fr;
    min-height:100vh;
  }

  /* ---------- Sidebar ---------- */
  .sidebar{
    background:var(--panel);
    border-right:1px solid var(--line);
    padding:22px 0 22px 0;
    display:flex;
    flex-direction:column;
    min-height:100vh;
  }
  .brand{
    padding:0 20px 18px 20px;
    border-bottom:1px solid var(--line);
    margin-bottom:6px;
  }
  .brand-eyebrow{
    font-family:"IBM Plex Mono",monospace;
    font-size:10.5px;
    letter-spacing:.14em;
    color:var(--brass);
    text-transform:uppercase;
  }
  .song-list{
    list-style:none;
    margin:0;
    padding:6px 10px;
    overflow-y:auto;
    flex:1;
  }
  .song-item{
    display:flex;
    align-items:baseline;
    gap:10px;
    padding:9px 10px;
    border-radius:6px;
    cursor:pointer;
    color:var(--text-lo);
  }
  .song-item:hover{ background:var(--panel-2); }
  .song-item.active{
    background:var(--panel-2);
    color:var(--text-hi);
    box-shadow:inset 3px 0 0 var(--brass);
  }
  .song-num{
    font-family:"IBM Plex Mono",monospace;
    font-size:11px;
    color:var(--text-lo);
    width:18px;
    flex:none;
  }
  .song-item.active .song-num{ color:var(--brass); }
  .song-meta{ flex:1; min-width:0; }
  .song-title{
    font-size:13.5px;
    font-weight:500;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .song-artist{
    font-size:11px;
    color:var(--text-lo);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .song-key{
    font-family:"IBM Plex Mono",monospace;
    font-size:11px;
    color:var(--brass);
    flex:none;
  }
  .sidebar-foot{
    padding:14px 20px 0 20px;
    border-top:1px solid var(--line);
    margin-top:8px;
  }
  .btn-ghost{
    width:100%;
    background:transparent;
    border:1px dashed var(--line);
    color:var(--text-lo);
    font-family:"IBM Plex Sans",sans-serif;
    font-size:12.5px;
    padding:9px 10px;
    border-radius:6px;
    cursor:pointer;
  }
  .btn-ghost:hover{ border-color:var(--brass); color:var(--brass); }

  /* artist switcher and tabs */
  .artist-label{
    display:block;
    margin-top:14px;
    font-family:"IBM Plex Mono",monospace;
    font-size:10px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--text-lo);
  }
  .artist-row{ display:flex; gap:8px; margin-top:6px; }
  .artist-select{
    flex:1;
    min-width:0;
    -webkit-appearance:none;
    appearance:none;
    font:600 19px "Fraunces",serif;
    color:var(--text-hi);
    background:var(--panel-2) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M1 1l4 4 4-4' fill='none' stroke='%239aa0ad' stroke-width='1.5'/></svg>") no-repeat right 11px center;
    border:1px solid var(--line);
    border-radius:6px;
    padding:6px 30px 6px 10px;
    cursor:pointer;
    text-overflow:ellipsis;
  }
  .artist-select:hover{ border-color:var(--brass); }
  .artist-select option{ font:500 14px "IBM Plex Sans",sans-serif; color:#111; background:#fff; }
  .icon-btn{
    width:36px;
    flex:none;
    font:600 18px/1 "IBM Plex Mono",monospace;
    color:var(--text-lo);
    background:transparent;
    border:1px dashed var(--line);
    border-radius:6px;
    cursor:pointer;
  }
  .icon-btn:hover{ color:var(--brass); border-color:var(--brass); }
  .artist-new{ display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .artist-input{
    flex:1 1 100%;
    font:500 14px "IBM Plex Sans",sans-serif;
    color:var(--text-hi);
    background:var(--panel-2);
    border:1px solid var(--brass);
    border-radius:6px;
    padding:8px 10px;
    outline:none;
  }
  .tabs{ display:flex; gap:4px; padding:8px 14px 2px; border-bottom:1px solid var(--line); }
  .tab{
    flex:1;
    font:600 12.5px "IBM Plex Sans",sans-serif;
    color:var(--text-lo);
    background:transparent;
    border:0;
    border-bottom:2px solid transparent;
    margin-bottom:-1px;
    padding:9px 4px;
    cursor:pointer;
  }
  .tab:hover{ color:var(--text-hi); }
  .tab[aria-selected="true"]{ color:var(--text-hi); border-bottom-color:var(--brass); }
  .tab-count{ font:500 11px "IBM Plex Mono",monospace; color:var(--text-lo); margin-left:6px; font-variant-numeric:tabular-nums; }
  .tab[aria-selected="true"] .tab-count{ color:var(--brass); }
  .list-empty{ padding:14px 10px; font-size:12.5px; color:var(--text-lo); }
  .btn-ghost:disabled{ opacity:.4; cursor:default; }
  .btn-ghost:disabled:hover{ border-color:var(--line); color:var(--text-lo); }
  .artist-select:focus-visible, .icon-btn:focus-visible, .tab:focus-visible, .song-item:focus-visible, .btn-ghost:focus-visible{
    outline:2px solid var(--brass);
    outline-offset:2px;
  }

  /* setlist sheet: a stage setlist that can also be printed */
  .sl-rows{ list-style:none; margin:0; padding:0; }
  .sl-row{
    position:relative;
    display:grid;
    grid-template-columns:22px 34px minmax(0,1fr) auto 64px 26px;
    align-items:center;
    gap:10px;
    padding:9px 4px;
    border-bottom:1px solid #dcdacd;
  }
  .sl-handle{
    width:22px; height:28px;
    display:flex; align-items:center; justify-content:center;
    background:transparent;
    border:0;
    border-radius:4px;
    color:#b3b09f;
    cursor:grab;
    touch-action:none;
    padding:0;
  }
  .sl-handle:hover{ color:var(--brass-dim); background:rgba(199,154,69,.14); }
  .sl-num{ font:600 14px "IBM Plex Mono",monospace; color:#8a8873; font-variant-numeric:tabular-nums; }
  .sl-title{
    font:600 21px/1.2 "Fraunces",serif;
    color:var(--ink);
    text-align:left;
    background:transparent;
    border:0;
    padding:0;
    cursor:pointer;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .sl-title:hover{ text-decoration:underline; text-decoration-color:var(--brass); text-underline-offset:3px; }
  .sl-missing{ color:#a9a693; font-style:italic; cursor:default; }
  .sl-missing:hover{ text-decoration:none; }
  .sl-artist{
    font:italic 400 13px "Fraunces",serif;
    color:#6b6a5f;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    max-width:190px;
  }
  .sl-key{ font:700 14px "IBM Plex Mono",monospace; color:var(--ink); text-align:right; }
  .sl-remove{
    width:24px; height:24px;
    border-radius:4px;
    border:1px solid transparent;
    background:transparent;
    color:#a9a693;
    font:600 16px/1 "IBM Plex Mono",monospace;
    cursor:pointer;
    padding:0;
  }
  .sl-remove:hover{ border-color:#d9a79c; color:#b5543f; }
  .sl-row.dragging{ opacity:.35; }
  .sl-row.just-moved{ animation:movedFlash 900ms ease-out; }
  @media (prefers-reduced-motion: reduce){ .sl-row.just-moved{ animation:none; } }
  .sl-empty{ padding:26px 0 8px; color:#8a8873; font-style:italic; }
  .sl-add{ margin-top:26px; padding-top:16px; border-top:2px solid var(--ink); }
  .sl-add-head{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px; }
  .sl-add-title{ font:600 11px "IBM Plex Mono",monospace; letter-spacing:.12em; text-transform:uppercase; color:#5d5c52; }
  .sl-add-count{ font:500 11px "IBM Plex Mono",monospace; color:#8a8873; font-variant-numeric:tabular-nums; }
  .sl-search{
    width:100%;
    font:500 14px "IBM Plex Sans",sans-serif;
    color:var(--ink);
    background:#fbfaf5;
    border:1px solid #cfccbd;
    border-radius:6px;
    padding:8px 10px;
    outline:none;
  }
  .sl-search:focus{ border-color:var(--brass-dim); box-shadow:0 0 0 3px rgba(199,154,69,.2); }
  .sl-archive{ list-style:none; margin:8px 0 0; padding:0; max-height:320px; overflow-y:auto; }
  .sl-pick{
    width:100%;
    display:grid;
    grid-template-columns:18px minmax(0,1fr) auto 56px;
    gap:10px;
    align-items:baseline;
    text-align:left;
    background:transparent;
    border:0;
    border-radius:5px;
    padding:7px 8px;
    cursor:pointer;
    color:var(--ink);
  }
  .sl-pick:hover, .sl-pick:focus-visible{ background:rgba(199,154,69,.14); outline:none; }
  .sl-pick-plus{ font:700 14px "IBM Plex Mono",monospace; color:var(--brass-dim); }
  .sl-pick-title{ font:500 14px "IBM Plex Sans",sans-serif; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sl-pick-artist{ font:400 12px "IBM Plex Sans",sans-serif; color:#6b6a5f; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:180px; }
  .sl-archive-empty{ padding:10px 8px; color:#8a8873; font-size:13px; }
  .sl-handle:focus-visible, .sl-title:focus-visible, .sl-remove:focus-visible{ outline:2px solid var(--brass); outline-offset:2px; }
  @media print{
    .sl-handle, .sl-remove, .sl-add{ display:none !important; }
    .sl-row{ grid-template-columns:40px minmax(0,1fr) auto 70px; padding:12px 0; }
    .sl-title{ font-size:26px; }
  }

  .file-row{ display:flex; gap:6px; margin-top:8px; }
  .btn.danger, .icon-btn.danger{ color:#e2a39b; }
  .btn.danger:hover, .icon-btn.danger:hover{ border-color:#c0564b; color:#f0b7b0; }
  .icon-btn.danger svg{ display:block; margin:auto; }
  .file-row .btn-ghost{ flex:1; font-size:12px; padding-left:6px; padding-right:6px; }

  /* ---------- Main stage ---------- */
  .stage{
    min-width:0;
    padding:34px 40px 60px 40px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .toolbar{
    width:794px;
    max-width:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:14px;
  }
  .toolbar-group{ display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
  .btn{
    font-family:"IBM Plex Sans",sans-serif;
    font-size:12.5px;
    font-weight:500;
    background:var(--panel-2);
    color:var(--text-hi);
    border:1px solid var(--line);
    padding:7px 12px;
    border-radius:6px;
    cursor:pointer;
  }
  .btn:hover{ border-color:var(--brass); }
  .btn.primary{
    background:var(--brass);
    border-color:var(--brass);
    color:#211a08;
    font-weight:600;
  }
  .btn.primary:hover{ filter:brightness(1.08); }
  .toolbar-group{ align-items:center; }
  .btn:disabled{ opacity:.45; cursor:default; }
  .btn:disabled:hover{ border-color:var(--line); filter:none; }
  .btn.primary:disabled:hover{ border-color:var(--brass); }
  .save-status{
    font-family:"IBM Plex Mono",monospace;
    font-size:11.5px;
    color:var(--text-lo);
    margin-right:6px;
    font-variant-numeric:tabular-nums;
  }
  .save-status.dirty{ color:var(--brass); }
  .save-status.error{ color:#e58b7c; }
  .import-bar{
    width:794px;
    max-width:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    margin-bottom:14px;
    padding:10px 12px 10px 16px;
    background:var(--panel-2);
    border:1px solid var(--line);
    box-shadow:inset 3px 0 0 var(--brass);
    border-radius:6px;
    font-size:13px;
    color:var(--text-lo);
  }
  .import-bar b{ color:var(--text-hi); font-weight:600; }
  .import-actions{ display:flex; gap:8px; flex:none; }
  @media print{ .import-bar{ display:none !important; } }

  .sheet{
    width:794px;
    max-width:100%;
    background:var(--paper);
    color:var(--ink);
    border-radius:3px;
    box-shadow:0 18px 40px -14px rgba(0,0,0,.65), 0 2px 0 var(--paper-2) inset;
    padding:40px 36px 46px 36px;
  }

  /* header / spec line */
  .spec{
    display:grid;
    grid-template-columns:1fr auto;
    align-items:end;
    gap:8px 24px;
    border-bottom:2px solid var(--ink);
    padding-bottom:14px;
    margin-bottom:22px;
  }
  .spec-title{
    font-family:"Fraunces",serif;
    font-weight:700;
    font-size:30px;
    line-height:1.1;
    outline:none;
    text-wrap:balance;
  }
  .spec-artist{
    font-family:"Fraunces",serif;
    font-style:italic;
    font-weight:400;
    font-size:15px;
    color:#4b4a42;
    margin-top:4px;
    outline:none;
  }
  .spec-facts{
    font-family:"IBM Plex Mono",monospace;
    font-size:12px;
    text-align:right;
    color:#4b4a42;
    white-space:nowrap;
  }
  .spec-facts .fact{ margin-left:14px; }
  .spec-facts .fact b{
    color:var(--ink);
    font-weight:700;
    outline:none;
  }
  [contenteditable]:focus{
    background:rgba(199,154,69,.16);
    border-radius:2px;
  }

  /* ---------- Toolbar: song layout and marks for the selected bars ---------- */
  .toolbar{ flex-direction:column; align-items:stretch; gap:8px; }
  .toolbar-row{ display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px; width:100%; }
  .stepper{ display:inline-flex; align-items:center; gap:4px; margin-right:8px; }
  .stepper-label{ font-size:12px; color:var(--text-lo); margin-right:4px; }
  .step-btn{
    width:28px; height:28px;
    padding:0;
    font:600 16px/1 "IBM Plex Mono",monospace;
    color:var(--text-hi);
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:6px;
    cursor:pointer;
  }
  .step-btn:hover{ border-color:var(--brass); }
  .step-btn:disabled{ opacity:.4; cursor:default; }
  .step-btn:disabled:hover{ border-color:var(--line); }
  .step-val{ min-width:26px; text-align:center; font:600 14px "IBM Plex Mono",monospace; color:var(--text-hi); font-variant-numeric:tabular-nums; }
  .tb-hint{ font-size:11.5px; color:var(--brass); }
  .marks-bar{
    justify-content:flex-start;
    flex-wrap:wrap;
    gap:6px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:8px;
    padding:8px 10px;
  }
  .sel-info{ font:600 11px "IBM Plex Mono",monospace; color:var(--brass); min-width:96px; font-variant-numeric:tabular-nums; }
  .tb-input{
    font:500 12.5px "IBM Plex Sans",sans-serif;
    color:var(--text-hi);
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:6px;
    padding:5px 8px;
    width:118px;
  }
  .tb-note{ width:148px; }
  .tb-chip{
    min-width:32px;
    height:30px;
    padding:0 6px;
    font-family:"Noto Music","Apple Symbols","Segoe UI Symbol",serif;
    font-size:17px;
    line-height:1;
    color:var(--text-hi);
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:6px;
    cursor:pointer;
  }
  .tb-chip[aria-pressed="true"]{ background:var(--brass); border-color:var(--brass); color:#211a08; }
  .tb-select{
    font:500 12px "IBM Plex Sans",sans-serif;
    color:var(--text-hi);
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:6px;
    padding:5px 6px;
  }
  .tb-btn{
    font:600 12px "IBM Plex Sans",sans-serif;
    color:var(--text-hi);
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:6px;
    padding:6px 10px;
    cursor:pointer;
  }
  .tb-sep{ flex:1; }
  .tb-chip:hover, .tb-btn:hover, .tb-select:hover{ border-color:var(--brass); }
  .tb-input:disabled, .tb-chip:disabled, .tb-select:disabled, .tb-btn:disabled{ opacity:.4; cursor:default; }
  .tb-chip:disabled:hover, .tb-btn:disabled:hover, .tb-select:disabled:hover{ border-color:var(--line); }
  .btn:focus-visible, .tb-input:focus-visible, .tb-chip:focus-visible, .tb-select:focus-visible, .tb-btn:focus-visible, .step-btn:focus-visible{
    outline:2px solid var(--brass);
    outline-offset:2px;
  }

  /* ---------- Song page: one A4 sheet ---------- */
  /* The sheet keeps its A4 layout and is scaled down as a whole when the window is narrower. */
  #sheetHost{ width:794px; max-width:100%; }
  .page-fit{ position:relative; margin:0 auto; }
  .page-fit > .page{ transform-origin:top left; }
  @media (max-width: 900px){
    .app{ grid-template-columns:1fr; }
    .sidebar{ min-height:0; max-height:46vh; overflow:auto; border-right:0; border-bottom:1px solid var(--line); padding:14px 0; }
    .stage{ padding:16px 12px 40px; }
  }
  .page{
    position:relative;
    flex:none;
    width:794px;
    height:1123px;
    background:var(--paper);
    color:var(--ink);
    border-radius:3px;
    box-shadow:0 18px 40px -14px rgba(0,0,0,.65), 0 2px 0 var(--paper-2) inset;
    overflow:hidden;
  }
  .page-head{
    position:absolute;
    left:40px; right:40px; top:38px;
    display:grid;
    grid-template-columns:1fr auto;
    align-items:end;
    gap:6px 24px;
    border-bottom:2px solid var(--ink);
    padding-bottom:10px;
  }
  .page-grid{ position:absolute; inset:0; pointer-events:none; }
  .page-svg{ position:absolute; left:0; top:0; }
  .page-svg line{ stroke:var(--ink); }
  .page-svg circle{ fill:var(--ink); }
  .page-svg .clef{ font-family:"Noto Music","Apple Symbols","Segoe UI Symbol",serif; fill:var(--ink); }
  .page-svg .timesig, .page-svg .volta-num{ font-family:"IBM Plex Sans",sans-serif; font-weight:700; fill:var(--ink); }
  .bar-cell{ position:absolute; pointer-events:auto; cursor:pointer; border-radius:3px; }
  .bar-cell:hover{ background:rgba(199,154,69,.07); }
  .sel-layer{ position:absolute; inset:0; pointer-events:none; }
  .sel-rect{
    position:absolute;
    background:rgba(199,154,69,.16);
    box-shadow:inset 0 0 0 1.5px rgba(138,111,57,.55);
    border-radius:3px;
  }
  .ann{
    position:absolute;
    display:flex;
    align-items:center;
    gap:.45em;
    white-space:nowrap;
    overflow:hidden;
    pointer-events:none;
    line-height:1;
    color:var(--ink);
  }
  .ann-right{ justify-content:flex-end; }
  .ann-label{
    flex:none;
    font-family:"IBM Plex Sans",sans-serif;
    font-weight:700;
    letter-spacing:.04em;
    text-transform:uppercase;
    border:1.2px solid var(--ink);
    border-radius:2px;
    padding:.06em .4em;
  }
  .ann-note{ font-family:"Fraunces",serif; font-style:italic; font-weight:700; font-size:.92em; color:var(--ink); overflow:hidden; text-overflow:ellipsis; }
  .ann-end{ font-family:"Fraunces",serif; font-style:italic; font-weight:600; font-size:1.15em; }
  .ann-times{ font-family:"IBM Plex Sans",sans-serif; font-weight:700; font-size:1.1em; }
  .ann-glyph{ flex:none; font-family:"Noto Music","Apple Symbols","Segoe UI Symbol",serif; font-size:1.6em; line-height:1; }

  /* rhythm editor under the marks menu */
  .rhythm-panel{ flex-basis:100%; display:flex; flex-direction:column; gap:8px; margin-top:4px; padding-top:10px; border-top:1px solid var(--line); }

  .rp-cell{
    display:flex; flex-direction:column; align-items:center; gap:4px;
    width:34px;
    padding:6px 0 4px;
    background:var(--panel-2);

    cursor:pointer;

    font:500 10.5px "IBM Plex Mono",monospace;
  }
  .rp-cell.on-beat{ color:var(--text-hi); font-weight:700; }

  .rp-cell[data-state="."] .rp-mark::after{ content:""; width:4px; height:4px; border-radius:50%; background:var(--line); }
  .rp-cell[data-state="x"] .rp-mark{ background:var(--brass); }
  .rp-cell[data-state="X"] .rp-mark{ background:var(--brass); color:#211a08; }
  .rp-cell[data-state="-"] .rp-mark{ width:16px; height:6px; border-radius:2px; background:var(--text-lo); }
  .rp-grid.off .rp-cell{ opacity:.45; }

  /* rhythm notation on the page */
  .page-svg .rh-head{ fill:var(--ink); }
  .page-svg .rh-head.hollow{ fill:none; stroke:var(--ink); }
  .page-svg .rh-beam{ fill:var(--ink); }
  .page-svg .rh-tie, .page-svg .rh-flag, .page-svg .rh-accent, .page-svg .rh-rest path{ fill:none; stroke:var(--ink); stroke-linecap:round; stroke-linejoin:round; }
  .page-svg .rh-rest rect, .page-svg .rest-bar rect{ fill:var(--ink); }
  .chord-slot.rhythmic{ text-align:left; padding-left:2px; }
  .chord-slot.rhythmic:not(:focus){ color:transparent; text-shadow:none; }
  .chord-slot.rhythmic:focus + .rh-chords{ visibility:hidden; }
  .rh-chords{ position:absolute; pointer-events:none; font-family:"IBM Plex Mono",monospace; font-weight:700; color:var(--ink); white-space:nowrap; }
  .rh-chords span{ position:absolute; top:0; text-shadow:0 0 3px var(--paper), 0 0 3px var(--paper), 0 0 2px var(--paper); }

  /* Chords sit inside the staff; the paper-coloured halo keeps staff lines out of the letters. */
  .chord-slot{
    position:absolute;
    pointer-events:auto;
    font-family:"IBM Plex Mono",monospace;
    font-weight:700;
    text-align:center;
    white-space:nowrap;
    color:var(--ink);
    text-shadow:0 0 3px var(--paper), 0 0 3px var(--paper), 0 0 2px var(--paper), 0 0 2px var(--paper);
    outline:none;
    border-radius:3px;
    cursor:text;
  }
  .chord-slot:empty:focus::before{ content:"akor"; font-weight:500; font-size:.7em; color:#a9a693; }
  .chord-slot:focus{ background:rgba(199,154,69,.18); }
  /* "%" is kept as editable text but only the one-bar repeat sign on the staff is shown */
  .chord-slot.is-repeat{ color:transparent; text-shadow:none; }
  .chord-slot.is-repeat::selection{ background:transparent; }
  .simile-btn{
    position:absolute;
    z-index:15;
    transform:translateX(-50%);
    width:26px; height:22px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    color:var(--text-hi);
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:6px;
    padding:0;
    cursor:pointer;
    box-shadow:0 6px 14px -6px rgba(0,0,0,.5);
  }
  .simile-btn:hover{ border-color:var(--brass); color:var(--brass); }

  .empty-state{ width:794px; max-width:100%; color:var(--text-lo); padding:60px 20px; text-align:center; font-family:"IBM Plex Sans",sans-serif; }
  .sheet{ position:relative; }
  body.is-dragging, body.is-dragging *{ cursor:grabbing !important; user-select:none; }
  .drop-indicator{
    position:absolute;
    left:28px; right:28px;
    height:3px;
    background:var(--brass);

  }

  }

  @media print{

    .sidebar, .toolbar, .import-bar, .page-help, .sel-layer, .simile-btn, .foot-note{ display:none !important; }
    .app{ display:block; }

<script>
(function(){
  "use strict";

  var db = null;
  var selectedId = null;
  var currentDoc = null;      // full data of the open song or setlist
  var docUnsub = null;
  var dirty = false;
  var saving = false;
  var savedJson = null;
  var lastSavedAt = null;

  var view = "songs";         // "songs" | "setlists"
  var artists = [];           // [{id, name, order, legacyDefault}]
  var songsAll = [];          // [{id, order, title, artist, key, artistId}]
  var setlistsAll = [];       // [{id, name, artistId, songIds, createdAt}]
  var loaded = {artists:false, songs:false, setlists:false};
  var currentArtistId = null;
  var lastSelected = {songs:null, setlists:null};
  var setlistQuery = "";
  var focusNameFor = null;
  var ARTIST_PREF_KEY = "setlist-defteri-artist";
  var LOCAL_DB_KEY = "setlist-defteri-v2";

  var GRIP_SVG = '<svg width="10" height="16" viewBox="0 0 10 16" aria-hidden="true">'+
    '<circle cx="2.5" cy="2.5" r="1.6" fill="currentColor"/><circle cx="7.5" cy="2.5" r="1.6" fill="currentColor"/>'+
    '<circle cx="2.5" cy="8" r="1.6" fill="currentColor"/><circle cx="7.5" cy="8" r="1.6" fill="currentColor"/>'+
    '<circle cx="2.5" cy="13.5" r="1.6" fill="currentColor"/><circle cx="7.5" cy="13.5" r="1.6" fill="currentColor"/></svg>';

  var DEMO_SONGS = [
    { id:"01", order:1, title:"Fell in Love with a Boy", artist:"Joss Stone", key:"Bbm", tempo:"85", timeSig:"4/4",
      systems:[
        {label:"Intro", measures:["Bbm"], repeatStart:true, repeatEnd:true, repeatCount:"×4", note:"fingerpicking"},
        {label:"Verse 1", measures:["Bbm","Bbm7","F7","Eb7"], repeatStart:true, repeatEnd:true, repeatCount:"×2", note:""},
        {label:"Chorus", measures:["Bbm","Bbm7"], repeatStart:true, repeatEnd:true, repeatCount:"×4", note:"\"oooh\" vokal"},
        {label:"Verse 2", measures:["Bbm","Bbm7","F7","Eb7"], repeatStart:true, repeatEnd:true, repeatCount:"×2", note:"Verse 1 ile aynı"},
        {label:"Chorus", measures:["Bbm","Bbm7"], repeatStart:true, repeatEnd:true, repeatCount:"×4", note:""},
        {label:"Bridge", measures:["F7","Eb7"], repeatStart:true, repeatEnd:true, repeatCount:"×4", note:""},
        {label:"Final Verse", measures:["Bbm","Bbm7","F7","Eb7"], repeatStart:true, repeatEnd:true, repeatCount:"×2", note:"Verse 1 ile aynı"},
        {label:"Outro", measures:["Bbm","Bbm7"], repeatStart:true, repeatEnd:true, repeatCount:"×4", note:"fade out"}
      ]
    }
  ];

  function escapeHtml(s){
    return String(s==null?"":s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  function clone(v){ return JSON.parse(JSON.stringify(v)); }

  // ---------------- Data ----------------
  // Offline stand-in with the same calls as the shared db, kept in this browser only.
  function createLocalDb(){
    var store = {}, saved = null;
    try { saved = localStorage.getItem(LOCAL_DB_KEY); store = JSON.parse(saved || "{}") || {}; } catch(e){ store = {}; }
    // Only a first start gets the example; a library emptied on purpose stays empty.
    if (saved === null && !Object.keys(store).length){
      store["artists/ornek"] = {name:"Örnek proje", order:1, legacyDefault:true};
      var legacy = null;
      try { legacy = JSON.parse(localStorage.getItem("setlist-defteri-v1") || "null"); } catch(e){}
      (Array.isArray(legacy) && legacy.length ? legacy : DEMO_SONGS).forEach(function(s){
        var body = clone(s);
        var id = body.id;
        delete body.id;
        store["songs/" + id] = body;
      });
    }
    var listeners = [];
    function persist(){ try { localStorage.setItem(LOCAL_DB_KEY, JSON.stringify(store)); } catch(e){} }
    function snap(path){
      var v = store[path];
      return {id:path.split("/").pop(), exists:!!v, data:function(){ return v ? clone(v) : undefined; }, metadata:{fromCache:false, hasPendingWrites:false}};
    }
    function listen(fn){
      listeners.push(fn);
      setTimeout(fn, 0);
      return function(){ listeners = listeners.filter(function(l){ return l !== fn; }); };
    }
    function write(path, body){
      if (body === null) delete store[path]; else store[path] = clone(body);
      persist();
      setTimeout(function(){ listeners.slice().forEach(function(l){ l(); }); }, 0);
      return Promise.resolve();
    }
    function docRef(path){
      return {
        id:path.split("/").pop(),
        path:path,
        get:function(){ return Promise.resolve(snap(path)); },
        set:function(d){ return write(path, d); },
        update:function(d){ return write(path, Object.assign({}, store[path] || {}, d)); },
        delete:function(){ return write(path, null); },
        onSnapshot:function(next){ return listen(function(){ next(snap(path)); }); }
      };
    }
    function query(name, field, dir){
      return {
        onSnapshot:function(next){
          return listen(function(){
            var docs = Object.keys(store).filter(function(p){ return p.split("/")[0] === name && p.split("/").length === 2; }).map(snap);
            docs.sort(function(a, b){
              var x = a.data()[field], y = b.data()[field];
              if (x === y) return 0;
              if (x === undefined) return 1;
              if (y === undefined) return -1;
              return (x < y ? -1 : 1) * (dir === "desc" ? -1 : 1);
            });
            next({docs:docs, size:docs.length, empty:!docs.length});
          });
        }
      };
    }
    return {
      doc:docRef,
      collection:function(name){
        return {
          orderBy:function(field, dir){ return query(name, field, dir); },
          doc:function(id){ return docRef(name + "/" + (id || ("l" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7)))); }
        };
      }
    };
  }

  function boot(){
    showEmpty("Yükleniyor…");
    var started = false;
    function start(ns){
      if (started) return;
      started = true;
      db = ns || createLocalDb();
      subscribeAll();
    }
    if (window.claude && window.claude.use){
      window.claude.use("db").then(start, function(){ start(null); });
      setTimeout(function(){ start(null); }, 11000);
    } else {
      start(null);
    }
  }

  function subscribeAll(){
    var fail = function(){ showEmpty("Veriler yüklenemedi — sayfayı yenileyin."); };
    db.collection("artists").orderBy("order").onSnapshot(function(snap){
      artists = snap.docs.map(function(d){
        var v = d.data();
        return {id:d.id, name:v.name || "İsimsiz", order:v.order || 0, legacyDefault:!!v.legacyDefault};
      });
      loaded.artists = true;
      onDataChanged();
    }, fail);
    db.collection("songs").orderBy("order").onSnapshot(function(snap){
      songsAll = snap.docs.map(function(d){
        var v = d.data();
        return {id:d.id, order:v.order || 0, title:v.title, artist:v.artist, key:v.key, artistId:v.artistId || null};
      });
      loaded.songs = true;
      onDataChanged();
    }, fail);
    db.collection("setlists").orderBy("createdAt", "desc").onSnapshot(function(snap){
      setlistsAll = snap.docs.map(function(d){
        var v = d.data();
        return {id:d.id, name:v.name || "İsimsiz setlist", artistId:v.artistId, songIds:Array.isArray(v.songIds) ? v.songIds.slice() : [], createdAt:v.createdAt || ""};
      });
      loaded.setlists = true;
      onDataChanged();
    }, fail);
  }

  // An artist created a moment ago stays selected until the artists snapshot includes it.
  var pendingArtistId = null;

  function onDataChanged(){
    if (!loaded.artists || !loaded.songs || !loaded.setlists) return;
    if (pendingArtistId && artists.some(function(a){ return a.id === pendingArtistId; })) pendingArtistId = null;
    var keepPending = pendingArtistId !== null && currentArtistId === pendingArtistId;
    if (!keepPending && !artists.some(function(a){ return a.id === currentArtistId; })){
      var pref = null;
      try { pref = localStorage.getItem(ARTIST_PREF_KEY); } catch(e){}
      var found = artists.filter(function(a){ return a.id === pref; })[0] || artists[0];
      currentArtistId = found ? found.id : null;
    }
    renderArtistSelect();
    renderList();
    ensureSelection();
  }

  // Songs saved before artists existed carry no artistId; they belong to the artist marked legacyDefault.
  function legacyArtistId(){
    var a = artists.filter(function(x){ return x.legacyDefault; })[0];
    return a ? a.id : null;
  }
  function songArtistId(s){ return s.artistId || legacyArtistId(); }
  function artistSongs(){ return songsAll.filter(function(s){ return songArtistId(s) === currentArtistId; }); }
  function artistSetlists(){ return setlistsAll.filter(function(l){ return l.artistId === currentArtistId; }); }
  function currentItems(){ return view === "songs" ? artistSongs() : artistSetlists(); }
  function songById(id){ return songsAll.filter(function(s){ return s.id === id; })[0] || null; }
  function currentArtist(){ return artists.filter(function(a){ return a.id === currentArtistId; })[0] || null; }
  function leaveMessage(){ return "Kaydedilmemiş değişiklikler var. Kaydetmeden çıkılsın mı?"; }

  var missingIds = {};

  // An open item stays open even when a list snapshot has not caught up with it yet
  // (a song or setlist created a moment ago); a deleted item is noticed by its own doc snapshot.
  function ensureSelection(){
    if (selectedId) return;
    var items = currentItems().filter(function(i){ return !missingIds[i.id]; });
    var remembered = lastSelected[view];
    var next = items.some(function(i){ return i.id === remembered; }) ? remembered : (items[0] && items[0].id);
    if (next) selectItem(next, true);
    else clearSelection();
  }

  function closeCurrent(){
    if (docUnsub){ docUnsub(); docUnsub = null; }
    selectedId = null;
    currentDoc = null;
    savedJson = null;
    lastSavedAt = null;
    resetBarSelection();
    importLoadedFor = null;
    hideImportBar();
    setDirty(false);
    clearHistory();
  }

  function clearSelection(){
    closeCurrent();
    renderList();
    renderMain();
  }

  function selectItem(id, force){
    if (id === selectedId && currentDoc) return;
    if (dirty && !force && !confirm(leaveMessage())) return;
    var itemView = view;
    closeCurrent();
    selectedId = id;
    lastSelected[itemView] = id;
    if (itemView === "songs") checkImport(id);
    renderList();
    docUnsub = db.doc(itemView + "/" + id).onSnapshot(function(snap){
      if (view !== itemView || selectedId !== id) return;
      var v = snap.data();
      if (!v){
        missingIds[id] = true;
        if (!dirty){ closeCurrent(); renderList(); ensureSelection(); }
        return;
      }
      delete missingIds[id];
      if (currentDoc && (dirty || isEditingSheet())) return;
      currentDoc = clone(v);
      if (itemView === "songs") normalizeDoc(currentDoc); else normalizeSetlist(currentDoc);
      savedJson = JSON.stringify(currentDoc);
      renderMain();
    }, function(){
      showEmpty("Açılamadı — sayfayı yenileyin.");
    });
  }

  function switchView(next){
    if (next === view) return;
    if (dirty && !confirm(leaveMessage())) return;
    closeCurrent();
    view = next;
    updateTabs();
    renderList();
    ensureSelection();
  }

  function openSong(id){
    if (dirty && !confirm(leaveMessage())) return;
    closeCurrent();
    view = "songs";
    updateTabs();
    selectItem(id, true);
  }

  function switchArtist(id){
    if (id === currentArtistId) return;
    if (dirty && !confirm(leaveMessage())){ renderArtistSelect(); return; }
    closeCurrent();
    currentArtistId = id;
    try { localStorage.setItem(ARTIST_PREF_KEY, id); } catch(e){}
    lastSelected = {songs:null, setlists:null};
    setlistQuery = "";
    renderArtistSelect();
    renderList();
    ensureSelection();
  }

  function normalizeSetlist(d){
    if (typeof d.name !== "string") d.name = "";
    if (!Array.isArray(d.songIds)) d.songIds = [];
    var seen = {};
    d.songIds = d.songIds.filter(function(id){
      if (typeof id !== "string" || seen[id]) return false;
      seen[id] = true;
      return true;
    });
    return d;
  }

  function isEditingSheet(){
    var el = document.activeElement;
    return !!(el && el.closest && el.closest("#sheetHost"));
  }

  function setStatus(text, kind){
    var el = document.getElementById("saveStatus");
    el.textContent = text;
    el.className = "save-status" + (kind ? " " + kind : "");
  }

  function setDirty(v){
    dirty = v;
    document.getElementById("saveBtn").disabled = !v || saving;
    if (v) setStatus("● Kaydedilmemiş değişiklik", "dirty");
    else if (lastSavedAt) setStatus("Kaydedildi · " + lastSavedAt, "");
    else setStatus("", "");
  }

  // ---- undo / redo ----
  // Every change to the open song or setlist is remembered until another one is opened.
  var undoStack = [], redoStack = [];
  var UNDO_LIMIT = 100;

  function updateUndoButtons(){
    document.getElementById("undoBtn").disabled = !currentDoc || !undoStack.length;
    document.getElementById("redoBtn").disabled = !currentDoc || !redoStack.length;
  }
  function rememberState(snapshot){
    undoStack.push(snapshot);
    if (undoStack.length > UNDO_LIMIT) undoStack.shift();
    redoStack = [];
    updateUndoButtons();
  }
  function clearHistory(){
    undoStack = [];
    redoStack = [];
    updateUndoButtons();
  }
  function stepHistory(from, to, message){
    if (!currentDoc || !from.length) return;
    // A chord or name still being typed is finished first, so it can be undone too.
    var active = document.activeElement;
    if (active && active.closest && active.closest("#sheetHost")) active.blur();
    if (!from.length) return;
    to.push(JSON.stringify(currentDoc));
    currentDoc = JSON.parse(from.pop());
    setDirty(JSON.stringify(currentDoc) !== savedJson);
    renderMain();
    updateUndoButtons();
    setStatus(message + (dirty ? " · kaydedilmemiş değişiklik var" : ""), dirty ? "dirty" : "");
  }
  function undo(){ stepHistory(undoStack, redoStack, "↶ Geri alındı"); }
  function redo(){ stepHistory(redoStack, undoStack, "↷ Yinelendi"); }

  // Applies an edit locally; nothing is written until Kaydet.
  function saveDoc(patch){
    if (!currentDoc) return;
    var before = JSON.stringify(currentDoc);
    Object.keys(patch).forEach(function(k){ currentDoc[k] = clone(patch[k]); });
    if (patch.bars && Array.isArray(currentDoc.bars)) syncRepeatTimes(currentDoc.bars);
    if (JSON.stringify(currentDoc) !== before) rememberState(before);
    setDirty(JSON.stringify(currentDoc) !== savedJson);
  }

  function saveNow(){
    if (!currentDoc || saving) return;
    var active = document.activeElement;
    if (active && active.closest && active.closest("#sheetHost")) active.blur();
    if (!dirty) return;
    var id = selectedId;
    var itemView = view;
    if (itemView === "songs" && !currentDoc.artistId) currentDoc.artistId = currentArtistId;
    var payload = clone(currentDoc);
    saving = true;
    document.getElementById("saveBtn").disabled = true;
    setStatus("Kaydediliyor…", "");
    db.doc(itemView + "/" + id).set(payload).then(function(){
      saving = false;
      if (selectedId === id && view === itemView) afterSaved(id, payload);
    }).catch(function(){
      saving = false;
      document.getElementById("saveBtn").disabled = false;
      setStatus("Kaydedilemedi — bağlantıyı kontrol edip tekrar deneyin.", "error");
    });
  }

  function afterSaved(id, payload){
    if (view === "songs" && importLoadedFor === id){
      db.doc("imports/" + id).delete().catch(function(){});
      importLoadedFor = null;
    }
    savedJson = JSON.stringify(payload);
    var t = new Date();
    lastSavedAt = String(t.getHours()).padStart(2,"0") + ":" + String(t.getMinutes()).padStart(2,"0");
    setDirty(JSON.stringify(currentDoc) !== savedJson);
    renderList();
  }

  // ---------------- Transcription import ----------------
  // A prepared chart waits in imports/<songId>. Loading it only fills the editor;
  // nothing changes until the user saves, and the import is removed after that save.
  var pendingImport = null;
  var importLoadedFor = null;
  var importDismissed = {};

  function hideImportBar(){
    pendingImport = null;
    document.getElementById("importBar").hidden = true;
  }

  function checkImport(id){
    hideImportBar();
    if (importDismissed[id]) return;
    db.doc("imports/" + id).get().then(function(snap){
      if (view !== "songs" || selectedId !== id || !snap.exists) return;
      var v = snap.data();
      if (!v || !v.song || !Array.isArray(v.song.systems)) return;
      pendingImport = clone(v);
      document.getElementById("importSource").textContent = v.source ? "(" + v.source + ")" : "";
      document.getElementById("importBar").hidden = false;
    }).catch(function(){});
  }

  function loadImport(){
    if (!pendingImport || !currentDoc) return;
    if (dirty && !confirm("Kaydedilmemiş değişiklikleriniz transkripsiyonla değiştirilecek. Devam edilsin mi?")) return;
    var song = clone(pendingImport.song);
    song.order = currentDoc.order;
    if (currentDoc.artistId) song.artistId = currentDoc.artistId;
    rememberState(JSON.stringify(currentDoc));
    currentDoc = normalizeDoc(song);
    importLoadedFor = selectedId;
    resetBarSelection();
    hideImportBar();
    renderSheet();
    setDirty(JSON.stringify(currentDoc) !== savedJson);
    if (dirty) setStatus("● Transkripsiyon yüklendi — beğendiyseniz Kaydet'e basın", "dirty");
  }

  document.getElementById("importLoadBtn").addEventListener("click", loadImport);
  document.getElementById("importDismissBtn").addEventListener("click", function(){
    if (selectedId) importDismissed[selectedId] = true;
    hideImportBar();
  });

  // ---------------- Sidebar ----------------
  function renderArtistSelect(){
    document.getElementById("deleteArtistBtn").disabled = !artists.length;
    var sel = document.getElementById("artistSelect");
    sel.innerHTML = artists.map(function(a){
      return '<option value="'+escapeHtml(a.id)+'"'+(a.id === currentArtistId ? " selected" : "")+'>'+escapeHtml(a.name)+'</option>';
    }).join("");
    sel.disabled = !artists.length;
  }

  function updateTabs(){
    document.getElementById("tabSongs").setAttribute("aria-selected", String(view === "songs"));
    document.getElementById("tabSetlists").setAttribute("aria-selected", String(view === "setlists"));
  }

  function renderList(){
    var ul = document.getElementById("songList");
    var songs = artistSongs(), lists = artistSetlists();
    document.getElementById("songCount").textContent = currentArtistId ? songs.length : "";
    document.getElementById("setlistCount").textContent = currentArtistId ? lists.length : "";
    var addBtn = document.getElementById("addSongBtn");
    addBtn.textContent = view === "songs" ? "+ Yeni şarkı ekle" : "+ Yeni setlist";
    addBtn.disabled = !currentArtistId;
    var items;
    if (view === "songs"){
      items = songs.map(function(s, i){
        return '<li class="song-item'+(s.id === selectedId ? " active" : "")+'" data-id="'+escapeHtml(s.id)+'" tabindex="0">'+
          '<span class="song-num">'+String(i + 1).padStart(2,"0")+'</span>'+
          '<span class="song-meta">'+
            '<div class="song-title">'+escapeHtml(s.title || "İsimsiz şarkı")+'</div>'+
            '<div class="song-artist">'+escapeHtml(s.artist || "")+'</div>'+
          '</span>'+
          '<span class="song-key">'+escapeHtml(s.key || "")+'</span>'+
        '</li>';
      });
    } else {
      items = lists.map(function(l){
        return '<li class="song-item'+(l.id === selectedId ? " active" : "")+'" data-id="'+escapeHtml(l.id)+'" tabindex="0">'+
          '<span class="song-meta">'+
            '<div class="song-title">'+escapeHtml(l.name)+'</div>'+
            '<div class="song-artist">'+l.songIds.length+' şarkı</div>'+
          '</span>'+
        '</li>';
      });
    }
    if (!items.length && currentArtistId){
      items = ['<li class="list-empty">'+(view === "songs" ? "Bu projede henüz şarkı yok." : "Henüz setlist yok.")+'</li>'];
    }
    ul.innerHTML = items.join("");
    Array.prototype.forEach.call(ul.querySelectorAll(".song-item"), function(li){
      li.addEventListener("click", function(){ selectItem(li.getAttribute("data-id")); });
      li.addEventListener("keydown", function(e){
        if (e.key === "Enter" || e.key === " "){ e.preventDefault(); selectItem(li.getAttribute("data-id")); }
      });
    });
  }

  function addSong(){
    if (!currentArtistId) return;
    if (dirty && !confirm(leaveMessage())) return;
    var order = artistSongs().reduce(function(m, s){ return Math.max(m, s.order || 0); }, 0) + 1;
    var ref = db.collection("songs").doc();
    ref.set({artistId:currentArtistId, order:order, title:"Yeni Şarkı", artist:"", key:"", tempo:"", timeSig:"4/4", layout:{lines:DEFAULT_LINES, perLine:DEFAULT_PER_LINE}, bars:blankBars(DEFAULT_LINES * DEFAULT_PER_LINE)})
      .then(function(){ selectItem(ref.id, true); })
      .catch(function(){ showEmpty("Şarkı eklenemedi — tekrar deneyin."); });
  }

  function addSetlist(){
    if (!currentArtistId) return;
    if (dirty && !confirm(leaveMessage())) return;
    var ref = db.collection("setlists").doc();
    ref.set({artistId:currentArtistId, name:"Yeni setlist", songIds:[], createdAt:new Date().toISOString()})
      .then(function(){ focusNameFor = ref.id; selectItem(ref.id, true); })
      .catch(function(){ showEmpty("Setlist eklenemedi — tekrar deneyin."); });
  }

  function showArtistForm(show){
    document.getElementById("artistNewForm").hidden = !show;
    document.getElementById("artistRow").hidden = show;
    if (show){
      var input = document.getElementById("artistNewInput");
      input.value = "";
      input.focus();
    } else {
      document.getElementById("addArtistBtn").focus();
    }
  }

  document.getElementById("artistSelect").addEventListener("change", function(e){ switchArtist(e.target.value); });
  document.getElementById("addArtistBtn").addEventListener("click", function(){ showArtistForm(true); });
  document.getElementById("artistNewCancel").addEventListener("click", function(){ showArtistForm(false); });
  document.getElementById("artistNewInput").addEventListener("keydown", function(e){
    if (e.key === "Escape"){ e.preventDefault(); showArtistForm(false); }
  });
  document.getElementById("artistNewForm").addEventListener("submit", function(e){
    e.preventDefault();
    var name = document.getElementById("artistNewInput").value.trim();
    if (!name || !db) return;
    if (dirty && !confirm(leaveMessage())) return;
    var order = artists.reduce(function(m, a){ return Math.max(m, a.order || 0); }, 0) + 1;
    var ref = db.collection("artists").doc();
    ref.set({name:name, order:order}).then(function(){
      showArtistForm(false);
      try { localStorage.setItem(ARTIST_PREF_KEY, ref.id); } catch(err){}
      closeCurrent();
      pendingArtistId = ref.id;
      currentArtistId = ref.id;
      lastSelected = {songs:null, setlists:null};
      renderArtistSelect();
      renderList();
      renderMain();
    });
  });
  document.getElementById("tabSongs").addEventListener("click", function(){ switchView("songs"); });
  document.getElementById("tabSetlists").addEventListener("click", function(){ switchView("setlists"); });
  document.getElementById("addSongBtn").addEventListener("click", function(){
    if (view === "songs") addSong(); else addSetlist();
  });

  // ---------------- Main area ----------------
  function showEmpty(msg){
    document.getElementById("toolbar").hidden = true;
    document.getElementById("sheetHost").innerHTML = '<div class="empty-state">'+escapeHtml(msg)+'</div>';
  }

  function emptyMessage(){
    if (!artists.length) return "Başlamak için soldan bir sanatçı ya da proje ekleyin.";
    if (view === "songs") return artistSongs().length ? "Soldan bir şarkı seçin." : "Bu projede henüz şarkı yok. Soldan yeni şarkı ekleyin.";
    return artistSetlists().length ? "Soldan bir setlist seçin." : "Henüz setlist yok. Soldan yeni setlist oluşturun.";
  }

  function renderMain(){
    var del = document.getElementById("deleteItemBtn");
    del.title = view === "songs" ? "Açık şarkıyı sil" : "Açık setlisti sil";
    document.getElementById("songTools").hidden = view !== "songs";
    document.getElementById("marksBar").hidden = view !== "songs";
    if (!currentDoc){ showEmpty(emptyMessage()); return; }
    if (view === "songs") renderSheet(); else renderSetlist();
  }

  // ---------------- Setlist ----------------
  function renderSetlist(){
    var host = document.getElementById("sheetHost");
    document.getElementById("toolbar").hidden = false;
    var d = normalizeSetlist(currentDoc);
    var artist = currentArtist();
    var html = '<div class="sheet setlist-sheet" id="sheetPaper">';
    html += '<div class="spec"><div>';
    html += '<div class="spec-title" contenteditable="true" data-sl-field="name" aria-label="Setlist adı">'+escapeHtml(d.name)+'</div>';
    html += '<div class="spec-artist">'+escapeHtml(artist ? artist.name : "")+'</div>';
    html += '</div><div class="spec-facts"><span class="fact">ŞARKI <b>'+d.songIds.length+'</b></span></div></div>';

    if (d.songIds.length){
      html += '<ol class="sl-rows">';
      d.songIds.forEach(function(sid, i){
        var s = songById(sid);
        html += '<li class="sl-row" data-index="'+i+'">'+
          '<button type="button" class="sl-handle" aria-label="'+escapeHtml((s && s.title) || "Şarkı")+': sırasını değiştir (sürükleyin ya da ↑ ↓)" title="Sürükleyerek taşı">'+GRIP_SVG+'</button>'+
          '<span class="sl-num">'+String(i + 1).padStart(2, "0")+'</span>'+
          (s ? '<button type="button" class="sl-title" data-open="'+escapeHtml(sid)+'" title="Nota sayfasını aç">'+escapeHtml(s.title || "İsimsiz şarkı")+'</button>'
             : '<span class="sl-title sl-missing">Silinmiş şarkı</span>')+
          '<span class="sl-artist">'+escapeHtml(s ? (s.artist || "") : "")+'</span>'+
          '<span class="sl-key">'+escapeHtml(s ? (s.key || "") : "")+'</span>'+
          '<button type="button" class="sl-remove" aria-label="Setlistten çıkar" title="Setlistten çıkar">×</button>'+
        '</li>';
      });
      html += '</ol>';
    } else {
      html += '<div class="sl-empty">Setlist boş. Aşağıdaki arşivden şarkı ekleyin.</div>';
    }

    var q = setlistQuery.trim().toLocaleLowerCase("tr");
    var inList = {};
    d.songIds.forEach(function(id){ inList[id] = true; });
    var archive = artistSongs();
    var candidates = archive.filter(function(s){
      if (inList[s.id]) return false;
      return !q || ((s.title || "") + " " + (s.artist || "")).toLocaleLowerCase("tr").indexOf(q) >= 0;
    });
    var allAdded = archive.every(function(s){ return inList[s.id]; });
    html += '<div class="sl-add">';
    html += '<div class="sl-add-head"><span class="sl-add-title">Arşivden ekle</span><span class="sl-add-count">'+candidates.length+' şarkı</span></div>';
    html += '<input class="sl-search" id="slSearch" type="search" placeholder="Şarkı ya da sanatçı ara… (Enter ilkini ekler)" aria-label="Arşivde ara" value="'+escapeHtml(setlistQuery)+'">';
    html += '<ul class="sl-archive">';
    if (candidates.length){
      html += candidates.map(function(s){
        return '<li><button type="button" class="sl-pick" data-add="'+escapeHtml(s.id)+'">'+
          '<span class="sl-pick-plus">+</span>'+
          '<span class="sl-pick-title">'+escapeHtml(s.title || "İsimsiz şarkı")+'</span>'+
          '<span class="sl-pick-artist">'+escapeHtml(s.artist || "")+'</span>'+
          '<span class="sl-key">'+escapeHtml(s.key || "")+'</span>'+
        '</button></li>';
      }).join("");
    } else {
      html += '<li class="sl-archive-empty">'+(archive.length && allAdded ? "Arşivdeki bütün şarkılar bu setlistte." : (archive.length ? "Aramaya uyan şarkı yok." : "Bu projenin arşivinde henüz şarkı yok."))+'</li>';
    }
    html += '</ul></div>';
    html += '<div class="foot-note">Şarkıları soldaki tutamaçtan sürükleyerek sıralayın (ya da tutamaca tıklayıp ↑ ↓). Şarkı adına tıklayınca nota sayfası açılır.</div>';
    html += '</div>';

    host.innerHTML = html;
    wireSetlistEvents();
    if (focusNameFor === selectedId){
      focusNameFor = null;
      var nameEl = host.querySelector('[data-sl-field="name"]');
      nameEl.focus();
      var range = document.createRange();
      range.selectNodeContents(nameEl);
      var sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    }
  }

  function setSongIds(ids){
    saveDoc({songIds: ids});
    renderSetlist();
  }

  function wireSetlistEvents(){
    var host = document.getElementById("sheetHost");
    var nameEl = host.querySelector('[data-sl-field="name"]');
    nameEl.addEventListener("keydown", function(e){
      if (e.key === "Enter"){ e.preventDefault(); nameEl.blur(); }
    });
    nameEl.addEventListener("blur", function(){ saveDoc({name: nameEl.textContent.trim()}); });

    Array.prototype.forEach.call(host.querySelectorAll("[data-open]"), function(b){
      b.addEventListener("click", function(){ openSong(b.getAttribute("data-open")); });
    });

    Array.prototype.forEach.call(host.querySelectorAll(".sl-remove"), function(b){
      b.addEventListener("click", function(){
        var i = parseInt(b.closest(".sl-row").getAttribute("data-index"), 10);
        var ids = currentDoc.songIds.slice();
        ids.splice(i, 1);
        setSongIds(ids);
        var removes = document.querySelectorAll("#sheetPaper .sl-remove");
        var target = removes[Math.min(i, removes.length - 1)] || document.getElementById("slSearch");
        if (target) target.focus();
      });
    });

    function addSong(id){
      var ids = currentDoc.songIds.slice();
      ids.push(id);
      setSongIds(ids);
      var rows = document.querySelectorAll("#sheetPaper .sl-row");
      if (rows.length) rows[rows.length - 1].classList.add("just-moved");
      var search = document.getElementById("slSearch");
      if (search) search.focus();
    }

    Array.prototype.forEach.call(host.querySelectorAll("[data-add]"), function(b){
      b.addEventListener("click", function(){ addSong(b.getAttribute("data-add")); });
    });

    var search = document.getElementById("slSearch");
    search.addEventListener("input", function(){
      setlistQuery = search.value;
      var pos = search.selectionStart;
      renderSetlist();
      var again = document.getElementById("slSearch");
      again.focus();
      try { again.setSelectionRange(pos, pos); } catch(e){}
    });
    search.addEventListener("keydown", function(e){
      if (e.key !== "Enter") return;
      e.preventDefault();
      var first = host.querySelector("[data-add]");
      if (first) addSong(first.getAttribute("data-add"));
    });

    Array.prototype.forEach.call(host.querySelectorAll(".sl-handle"), function(h){
      h.addEventListener("pointerdown", function(e){
        if (e.button !== 0) return;
        e.preventDefault();
        startRowDrag(parseInt(h.closest(".sl-row").getAttribute("data-index"), 10), e.clientY);
      });
      h.addEventListener("keydown", function(e){
        var i = parseInt(h.closest(".sl-row").getAttribute("data-index"), 10);
        var last = currentDoc.songIds.length - 1;
        if (e.key === "ArrowUp" && i > 0){ e.preventDefault(); moveRow(i, i - 1, true); }
        if (e.key === "ArrowDown" && i < last){ e.preventDefault(); moveRow(i, i + 1, true); }
      });
    });
  }

  function moveRow(from, to, refocus){
    var ids = currentDoc.songIds.slice();
    var item = ids.splice(from, 1)[0];
    ids.splice(to, 0, item);
    setSongIds(ids);
    var row = document.querySelector('#sheetPaper .sl-row[data-index="'+to+'"]');
    if (row){
      row.classList.add("just-moved");
      if (refocus) row.querySelector(".sl-handle").focus();
    }
  }

  var rowDrag = null;

  function startRowDrag(from, clientY){
    var sheet = document.getElementById("sheetPaper");
    var els = Array.prototype.slice.call(sheet.querySelectorAll(".sl-row"));
    if (els.length < 2) return;
    els[from].classList.add("dragging");
    var indicator = document.createElement("div");
    indicator.className = "drop-indicator";
    sheet.appendChild(indicator);
    rowDrag = {from: from, slot: from, els: els, indicator: indicator, sheet: sheet};
    document.body.classList.add("is-dragging");
    updateRowDrop(clientY);
    window.addEventListener("pointermove", onRowMove);
    window.addEventListener("pointerup", onRowUp);
    window.addEventListener("pointercancel", onRowCancel);
  }

  function updateRowDrop(clientY){
    var els = rowDrag.els;
    var slot = els.length;

        } else if (!(prv && prv.beams >= 2)){
          var dir = k === items.length - 1 ? -1 : 1, len = Math.min(7 * s, cw * 1.5);
          var x = dir > 0 ? it.stemX - 0.6 * s : it.stemX + 0.6 * s - len;
          out += '<rect class="rh-beam" x="'+px(x)+'" y="'+px(y2 - thick)+'" width="'+px(len)+'" height="'+px(thick)+'"/>';
        }
      });
    });
    return '<g class="rh" data-bar-rhythm="'+r+'">'+out+'</g>';
  }

  // Chords over a written rhythm sit above the hits they belong to, in order.
  function rhythmChordsHtml(chord, r, rb, barX, top, h, font, tieIn){
    var tokens = String(chord || "").trim().split(/\s+/).filter(Boolean);
    var html = '<div class="rh-chords" aria-hidden="true" style="left:'+px(barX)+'px;top:'+px(top)+'px;height:'+px(h)+'px;line-height:'+px(h)+'px;font-size:'+px(font)+'px">';
    if (tokens.length){
      // Chords go onto the hits in order. "/" keeps the chord going on a hit, and a "/" or "-"
      // may also stand for a rest; a chord never lands on a rest, it waits for the next hit.
      var cw = rb.w / r.length, slots = [], inRest = false;
      var pcs = rhythmPieces(r, tieIn), wholeNote = pcs.length === 1 && pcs[0].note && pcs[0].len === r.length;
      for (var i = 0; i < r.length; i++){
        var c = r.charAt(i);
        if (c === "x" || c === "X"){ slots.push({at:i, hit:true}); inRest = false; }
        else if ((c === "-" || (i === 0 && !tieIn)) && !inRest){ slots.push({at:i, hit:false}); inRest = true; }
      }
      if (!slots.some(function(o){ return o.hit; })) slots.unshift({at:0, hit:true});
      var filler = /^[\/.\-–—]+$/, shown = "", t = 0;
      for (var k = 0; k < slots.length && t < tokens.length; k++){
        var slot = slots[k];
        if (!slot.hit){
          if (filler.test(tokens[t])) t++;
          shown = "";
          continue;
        }
        var lastHit = !slots.slice(k + 1).some(function(o){ return o.hit; });
        // The last hit takes whatever chords are left.
        var text = lastHit ? tokens.slice(t).filter(function(x){ return !filler.test(x); }).join(" ") : tokens[t];
        t = lastHit ? tokens.length : t + 1;
        if (!text || filler.test(text) || text === shown) continue;
        shown = text;
        html += wholeNote
          ? '<span style="left:'+px(rb.x0 + rb.w / 2 - barX)+'px;transform:translateX(-50%)">'+escapeHtml(text)+'</span>'
          : '<span style="left:'+px(rb.x0 + slot.at * cw - barX)+'px">'+escapeHtml(text)+'</span>';
      }
    }
    return html + '</div>';
  }

  function gridSvg(d, G){
    var s = G.s, bars = d.bars, out = "";
    var rhCells = barCells(d);
    var groups = endingGroups(bars);
    var closedEnd = {};
    groups.forEach(function(g){ if (g.closed) closedEnd[g.to] = true; });
    G.rows.forEach(function(rowInfo, row){
      var top = rowStaffTop(G, row);
      var from = rowInfo.start, count = rowInfo.count, mW = rowInfo.mW;
      var staffEnd = count ? PAD_X + G.meta + count * mW : PAD_X + G.gridW;
      for (var k = 0; k < 5; k++) out += svgLine(PAD_X, top + k * 9 * s, staffEnd, top + k * 9 * s, Math.max(0.6, s));
      out += '<text class="clef" x="'+px(PAD_X + 2 * s)+'" y="'+px(top + 39.6 * s)+'" font-size="'+px(54 * s)+'">𝄞</text>';
      if (row === 0){
        var ts = String(meterAt(bars, d.timeSig, 0)).split("/");
        out += '<text class="timesig" x="'+px(PAD_X + 50 * s)+'" y="'+px(top + 17 * s)+'" font-size="'+px(19 * s)+'" text-anchor="middle">'+escapeHtml(ts[0] || "4")+'</text>';
        out += '<text class="timesig" x="'+px(PAD_X + 50 * s)+'" y="'+px(top + 35 * s)+'" font-size="'+px(19 * s)+'" text-anchor="middle">'+escapeHtml(ts[1] || "4")+'</text>';
      }
      for (var c = 0; c < count; c++){
        var i = from + c, b = bars[i], next = bars[i + 1];
        var xL = PAD_X + G.meta + c * mW, xR = xL + mW;
        if (b.repeatStart) out += startSign(xL, top, s);
        var meter = showsMeter(d, i);
        if (meter){
          var mts = b.timeSig.split("/"), mx = xL + (b.repeatStart ? 22 : 11) * s;
          out += '<text class="timesig" x="'+px(mx)+'" y="'+px(top + 17 * s)+'" font-size="'+px(19 * s)+'" text-anchor="middle">'+escapeHtml(mts[0])+'</text>';
          out += '<text class="timesig" x="'+px(mx)+'" y="'+px(top + 35 * s)+'" font-size="'+px(19 * s)+'" text-anchor="middle">'+escapeHtml(mts[1])+'</text>';
        }
        if (b.repeatEnd || closedEnd[i]) out += endSign(xR, top, s);
        else if (i === G.n - 1) out += finalBar(xR, top, s);
        else if (!(next && next.repeatStart && c < count - 1)) out += vBar(Math.min(xR, PAD_X + G.gridW - 0.6), top, s, 1.3 * s);
        if (isRepeatMeasure(b.chord)) out += simileSign(xL + mW / 2, top, s, i);
        else if (isRestMeasure(b.chord)) out += restBarSign(xL + mW / 2, top, s, i);
        else {
          var rh = rhythmOf(b, barCellsAt(d, i));
          if (rh) out += rhythmSvg(rh, rhythmBox(b, xL, xR, s, meter), top, s, b.tieIn);
        }
      }
      if (!count) return;
      groups.forEach(function(g){
        var a = Math.max(g.from, from), z = Math.min(g.to, from + count - 1);
        if (a > z) return;
        var x1 = PAD_X + G.meta + (a - from) * mW + (a === g.from ? 3 * s : 0);
        var x2 = PAD_X + G.meta + (z - from + 1) * mW - (z === g.to ? 3 * s : 0);
        var voltaFont = voltaFontFor(s);
        var yTop = top - BAND * s + annRowFor(s) + 2, yHook = top - 3 * s;
        out += svgLine(x1, yTop, x2, yTop, 1.4 * s);
        if (a === g.from){
          out += svgLine(x1, yTop, x1, yHook, 1.4 * s);
          out += '<text class="volta-num" x="'+px(x1 + (showsMeter(d, a) ? 20 : 4) * s)+'" y="'+px(yTop + voltaFont + 1)+'" font-size="'+px(voltaFont)+'">'+escapeHtml(g.label)+'</text>';
        }
        if (z === g.to && g.closed) out += svgLine(x2, yTop, x2, yHook, 1.4 * s);
      });
    });
    return '<svg class="page-svg" width="'+PAGE_W+'" height="'+PAGE_H+'" viewBox="0 0 '+PAGE_W+' '+PAGE_H+'" aria-hidden="true">'+out+'</svg>';
  }

  function overlaysHtml(d, G){
    var s = G.s, bars = d.bars, cells = "", texts = "";
    var chordFont = Math.max(13, 21 * s);
    var annFont = annFontFor(s);
    var annRow = annRowFor(s);
    var rhCells = barCells(d);
    // How far along its line the last section name or note reaches, so the bars under it are known.
    var annReach = -1, annReachRow = -1;
    bars.forEach(function(b, i){
      var box = barBox(G, i);
      cells += '<div class="bar-cell" data-i="'+i+'" style="left:'+px(box.x)+'px;top:'+px(box.top)+'px;width:'+px(box.mW)+'px;height:'+px(ROW_BASE * s)+'px"></div>';

      var left = "", right = "";
      if (b.startMark === "segno") left += '<span class="ann-glyph" title="Segno">𝄋</span>';
      if (b.startMark === "coda") left += '<span class="ann-glyph" title="Coda">𝄌</span>';
      if (b.label) left += '<span class="ann-label">'+escapeHtml(b.label)+'</span>';
      if (b.note) left += '<span class="ann-note">'+escapeHtml(b.note)+'</span>';
      if (b.endMark) right += '<span class="ann-end">'+escapeHtml(b.endMark)+'</span>'+(b.endMark === "To Coda" ? '<span class="ann-glyph">𝄌</span>' : "");
      if (b.repeatEnd && b.repeatTimes > 2 && !voltaTimes(bars, i)) right += '<span class="ann-times">'+b.repeatTimes+'x</span>';
      if (left){
        // A label or note may run over the following bars on its line until the next one.
        var span = 1;
        for (var j = i + 1; j < bars.length && G.barRow[j] === box.row; j++){
          if (bars[j].label || bars[j].note || bars[j].startMark) break;
          span++;
        }
        texts += '<div class="ann ann-left" style="left:'+px(box.x + 3 * s)+'px;top:'+px(box.top + 1)+'px;max-width:'+px(span * box.mW - 6 * s)+'px;height:'+px(annRow)+'px;font-size:'+px(annFont)+'px">'+left+'</div>';
        var est = (b.startMark ? 1.4 : 0) + (b.label ? b.label.length * 0.72 + 1.4 : 0) + (b.note ? b.note.length * 0.46 + 0.6 : 0);
        annReach = Math.min(box.x + 3 * s + est * annFont, box.x + span * box.mW);
        annReachRow = box.row;
      }
      if (right){
        texts += '<div class="ann ann-right" style="right:'+px(PAGE_W - box.right + 3 * s)+'px;top:'+px(box.top + 1)+'px;height:'+px(annRow)+'px;font-size:'+px(annFont)+'px">'+right+'</div>';
      }
      var rh = isRepeatMeasure(b.chord) || isRestMeasure(b.chord) ? null : rhythmOf(b, barCellsAt(d, i));
      if (rh){
        // With a rhythm written, the chords move above the staff and sit over their hits, as large as
        // the other chords. Under a section name, note, mark or ending they keep below that row and may
        // reach into the top space of the staff, which the slash notes on the middle line leave free.
        var under = !!left || !!right || !!b.ending || (annReachRow === box.row && box.x < annReach);
        var base = box.staffTop + (under ? 3 * s : -1);
        var room = base - (under ? box.top + annRow + 1 : box.top + 2);
        var rf = Math.min(chordFont, room / 1.12), rhH = rf * 1.12, rtop = base - rhH;
        texts += '<div class="chord-slot rhythmic" contenteditable="true" data-i="'+i+'" data-base="'+px(rf)+'" aria-label="'+(i + 1)+'. ölçü akoru" '+
          'style="left:'+px(box.x)+'px;top:'+px(rtop)+'px;width:'+px(box.mW)+'px;height:'+px(rhH)+'px;line-height:'+px(rhH)+'px;font-size:'+px(rf)+'px">'+escapeHtml(b.chord)+'</div>';
        texts += rhythmChordsHtml(b.chord, rh, rhythmBox(b, box.x, box.right, s, showsMeter(d, i)), box.x, rtop, rhH, rf, b.tieIn);
      } else {
        texts += '<div class="chord-slot'+(isRepeatMeasure(b.chord) || isRestMeasure(b.chord) ? " is-repeat" : "")+'" contenteditable="true" data-i="'+i+'" data-base="'+px(chordFont)+'" aria-label="'+(i + 1)+'. ölçü akoru" '+
          'style="left:'+px(box.x)+'px;top:'+px(box.staffTop - 2 * s)+'px;width:'+px(box.mW)+'px;height:'+px(40 * s)+'px;line-height:'+px(40 * s)+'px;font-size:'+px(chordFont)+'px">'+escapeHtml(b.chord)+'</div>';
      }
    });
    return cells + '<div class="sel-layer" id="selLayer"></div>' + texts;
  }

  // Adding or removing bars inside a line changes only that line: it gets its own bar
  // count, so the bars on every other line stay where they are.
  function tidyRowCounts(counts, perLine){
    counts = counts.map(function(v){ return v && v !== perLine ? v : null; });
    while (counts.length && !counts[counts.length - 1]) counts.pop();
    return counts;
  }

  function paddedRowCounts(){
    var counts = currentDoc.layout.rowCounts.slice();
    while (counts.length < geom.rows.length) counts.push(null);
    return counts;
  }

  function rowsNeeded(n, layout){
    for (var start = 0, r = 0; start < n; r++) start += rowBarCount(layout, r);
    return Math.max(1, r);
  }

  function commitBarEdit(bars, counts, dropFreedLines){
    var layout = clone(currentDoc.layout);
    layout.rowCounts = tidyRowCounts(counts, layout.perLine);
    // Lines emptied by deleting bars go too; empty lines left on purpose below them stay.
    if (dropFreedLines && geom){
      var after = rowsNeeded(bars.length, layout), freed = geom.needed - after;
      if (freed > 0 && layout.lines > after) layout.lines = Math.max(after, layout.lines - freed);
    }
    saveDoc({bars: bars, layout: layout});
    renderGrid();
  }

  function shiftSelection(from, delta){
    if (selA === null) return;
    if (selA >= from) selA = Math.max(0, selA + delta);
    if (selB >= from) selB = Math.max(0, selB + delta);
  }

  // The last line with bars keeps its width when it grows or shrinks, like the lines above it.
  function grownCount(info, r, lastRow, count){ return r === lastRow ? Math.max(info.cfg, count) : count; }

  function addBarAfterSelection(){
    if (!currentDoc || view !== "songs" || !geom) return;
    var r = selRange(), bars = clone(currentDoc.bars), counts = paddedRowCounts();
    if (!r){
      // Nothing selected: the new bar simply follows the last one.
      bars.push(blankBar());
      selA = selB = bars.length - 1;
    } else {
      var row = geom.barRow[r.to], info = geom.rows[row];
      var at = r.to + 1;
      bars.splice(at, 0, blankBar());
      if (info.count < 8) counts[row] = grownCount(info, row, geom.needed - 1, info.count + 1);
      selA = selB = at;
    }
    commitBarEdit(bars, counts);
  }

  // A new line of empty bars goes in above or below the selected bar's line. Every other
  // line keeps its bars, and any empty lines at the bottom of the page stay.
  function insertLine(below){
    if (!currentDoc || view !== "songs" || !geom) return;
    var sel = selRange();
    if (!sel) return;
    var r = geom.barRow[below ? sel.to : sel.from], info = geom.rows[r];
    var bars = clone(currentDoc.bars), counts = paddedRowCounts(), layout = clone(currentDoc.layout);
    var at = below ? info.start + info.count : info.start;
    // A short last line would otherwise take the new bars in.
    if (below && r === geom.needed - 1) counts[r] = info.count;
    for (var k = 0; k < layout.perLine; k++) bars.splice(at, 0, blankBar());
    counts.splice(below ? r + 1 : r, 0, layout.perLine);
    if (layout.lines >= geom.needed) layout.lines = Math.min(30, layout.lines + 1);
    layout.rowCounts = tidyRowCounts(counts, layout.perLine);
    selA = selB = at;
    saveDoc({bars: bars, layout: layout});
    renderGrid();
  }

  function deleteSelectedBars(){
    if (!currentDoc || view !== "songs" || !geom) return;
    var r = selRange();
    if (!r || r.to - r.from + 1 >= currentDoc.bars.length) return;
    var bars = clone(currentDoc.bars), counts = paddedRowCounts(), lastRow = geom.needed - 1;
    for (var row = geom.barRow[r.to]; row >= geom.barRow[r.from]; row--){
      var info = geom.rows[row];
      var removed = Math.min(r.to, info.start + info.count - 1) - Math.max(r.from, info.start) + 1;
      var remaining = info.count - removed;
      if (remaining === 0) counts.splice(row, 1);
      else if (row !== lastRow) counts[row] = remaining;
    }
    bars.splice(r.from, r.to - r.from + 1);
    selA = selB = Math.min(r.from, bars.length - 1);
    commitBarEdit(bars, counts, true);
  }

  function headerHtml(d){
    return '<div>'+
        '<div class="spec-title" contenteditable="true" data-field="title">'+escapeHtml(d.title || "")+'</div>'+
        '<div class="spec-artist" contenteditable="true" data-field="artist">'+escapeHtml(d.artist || "Sanatçı")+'</div>'+
      '</div>'+
      '<div class="spec-facts">'+
        '<span class="fact">TON <b contenteditable="true" data-field="key">'+escapeHtml(d.key || "—")+'</b></span>'+
        '<span class="fact">TEMPO <b contenteditable="true" data-field="tempo">'+escapeHtml(d.tempo || "—")+'</b></span>'+
        '<span class="fact">ÖLÇÜ <b contenteditable="true" data-field="timeSig">'+escapeHtml(d.timeSig || "4/4")+'</b></span>'+
      '</div>';
  }

  function renderSheet(){
    if (!currentDoc){ showEmpty(emptyMessage()); return; }
    document.getElementById("toolbar").hidden = false;
    var d = normalizeDoc(currentDoc);
    document.getElementById("sheetHost").innerHTML =
      '<div class="page-fit" id="pageFit"><div class="page" id="sheetPaper">'+
        '<div class="page-head" id="pageHead">'+headerHtml(d)+'</div>'+
        '<div class="page-grid" id="pageGrid"></div>'+
        '<button type="button" class="simile-btn" hidden aria-label="Önceki ölçüyü tekrarla" title="Önceki ölçüyü tekrarla">'+SIMILE_ICON+'</button>'+
      '</div></div>'+
      '<p class="page-help">Bir ölçüye tıklayın, Shift ile tıklayarak aralık seçin; bölüm adı, not, tekrar, volta ve yönlendirmeleri üstteki menüden ekleyin. Akoru ölçünün içine yazın. Boş ölçüde altında çıkan ikon ya da % önceki ölçüyü tekrarlar, - yazmak ölçüyü sus yapar. Menüdeki + Ölçü seçimin arkasına ölçü ekler, − Ölçü seçili ölçüleri siler, ↑ / ↓ satır seçili satırın üstüne ya da altına boş satır açar; diğer satırlar yerinde kalır. Senkop ya da hits için ölçüyü seçip menüdeki Ritim düğmesine basın. Ritimli ölçüde akorlar vuruşlara sırayla yerleşir; akoru bir sonraki vuruşa sürdürmek için / yazın, örneğin Eb7 / / / Ebm7; bir akor susa denk gelmez, sonraki vuruşa geçer. Önceki ölçüden devam eden nota için ritim panelinde Önceki ölçüden bağla düğmesine basın. Ara bir ölçüde ölçü sayısı değişiyorsa (örneğin tek bir 2/4 ölçü) ölçüyü seçip menüden Ölçü sayısı seçin; sonraki ölçü eskisine döner. Seçili ölçüleri Ctrl+C ile kopyalayıp başka bir ölçüyü seçerek Ctrl+V ile yapıştırın. Ctrl+Z ya da ↶ son değişikliği geri alır, Ctrl+Y ya da ↷ yineler.</p>';
    wireHeader();
